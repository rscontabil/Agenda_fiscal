.search-box{position:relative;}

(function(){

/* ---------- Firebase (mesmo projeto do app Agenda de Obrigações) ---------- */
const firebaseConfig = {

// Mesma lista de e-mails autorizados do app principal (a segurança de verdade fica nas regras do Firestore).
const ALLOWED_EMAILS = ['rscontabilidade79@gmail.com', 'jt.pimentel26@gmail.com'];

let currentUser = null;
let currentTenantId = null; // vem das custom claims do token, obtido no login
let empresasMain = []; // lista de empresas vinda do documento appData/main (somente leitura aqui)
let state = null; // documento tenants/{tenantId}/nfse_data/main: { clientes, servicos, notas, acessosPortal }
let activeTab = 'empresas';
let searchQuery = '';
let unsubMain = null;
let unsubNfse = null;

function uid(prefix){ return prefix + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

// Escapa texto vindo de dados do usuário/Firestore antes de interpolar em innerHTML,
// inclusive dentro de atributos com aspas duplas (value="...", data-x="...").
function escapeHtml(str){
  return String(str==null ? '' : str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

const DADOS_BANCARIOS_PADRAO = 'BANCO C6: PIX - CNPJ: 11.570.525/0001-89 - RS CONTABILIDADE E CONSULTORIA EMPRESARIAL LTDA.';

function formatarDataBR(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const aaaa = d.getFullYear();
  return `${dd}/${mm}/${aaaa}`;
}
function formatarValorPadrao(num){
  // Reproduz o formato "000,00" usado na planilha: zero à esquerda, vírgula decimal.
  const neg = num < 0;
  const v = Math.abs(Math.round(num * 100) / 100);
  let inteiro = String(Math.floor(v));
  while(inteiro.length < 3) inteiro = '0' + inteiro;
  const dec = String(Math.round((v - Math.floor(v)) * 100)).padStart(2,'0');
  return (neg? '-':'') + inteiro + ',' + dec;
}
function formatarPercentual(num){
  return num.toFixed(2).replace('.',',') + '%';
}

/**
 * Gera o texto de cobrança mensal de contabilidade (equivalente à fórmula
 * da planilha), a partir da data de competência (string "YYYY-MM-DD") e
 * do valor da nota.
 */
function gerarDescricaoMensal(servico, dataCompetenciaStr, valor){
  if(!dataCompetenciaStr) return '';
  const [ano, mes] = dataCompetenciaStr.split('-').map(Number); // mes: 1-12
  // Período: dia 20 do mês anterior até dia 19 do mês de competência
  const inicioPeriodo = new Date(ano, mes - 2, 20); // mes-2 = mês anterior (0-indexed)
  const fimPeriodo = new Date(ano, mes - 1, 19);
  const vencimento = new Date(ano, mes - 1, servico.diaVencimento || 10);

  const aliquota = servico.aliquotaImpostos || 0;
  const valorImposto = (valor || 0) * (aliquota / 100);

  return `Referente a serviços de contabilidade no periodo de ${formatarDataBR(inicioPeriodo)} há ${formatarDataBR(fimPeriodo)} `
    + `*Total dos Impostos: Alq. ${formatarPercentual(aliquota)}, Vlr. R$ ${formatarValorPadrao(valorImposto)}  `
    + `*Dados Bancários: ${servico.dadosBancarios || DADOS_BANCARIOS_PADRAO} `
    + `Vencimento: ${formatarDataBR(vencimento)} `
    + `Código completo do serviço: ${servico.codigoServicoMunicipal || ''}, ${servico.cnae || ''} - Serviços de contabilidade.`;
}

function showAuthGateLoginCard(message){
  document.getElementById('authGate').style.display = 'flex';
  document.getElementById('authGateLoginCard').style.display = '';
  document.getElementById('authGateLoadingCard').style.display = 'none';
  document.getElementById('headerUser').style.display = 'none';
  document.getElementById('authGateError').textContent = message || '';
}
function showAuthGateLoading(text){
  document.getElementById('authGate').style.display = 'flex';
  document.getElementById('authGateLoginCard').style.display = 'none';
  document.getElementById('authGateLoadingCard').style.display = '';
  document.getElementById('authGateLoadingText').textContent = text || 'Carregando…';
}
function hideAuthGate(){ document.getElementById('authGate').style.display = 'none'; }

document.getElementById('btnGoogleLogin').addEventListener('click', async ()=>{
  showAuthGateLoading('Entrando com o Google…');
  const provider = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(provider); }
  catch(e){ showAuthGateLoginCard('Não foi possível entrar (' + (e.code || e.message) + ').'); }
});
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  if(unsubMain){ unsubMain(); unsubMain = null; }
  if(unsubNfse){ unsubNfse(); unsubNfse = null; }
  await auth.signOut();
});

let pendingAuthError = null;
auth.onAuthStateChanged(async (user)=>{
  if(user){
    const email = (user.email || '').toLowerCase();
    if(!ALLOWED_EMAILS.includes(email)){
      pendingAuthError = 'Esse e-mail (' + user.email + ') não tem acesso a este aplicativo.';
      await auth.signOut();
      return;
    }

    // Busca o tenantId gravado nas custom claims do token (definido no
    // backend via Admin SDK). Sem isso, não sabemos de qual escritório
    // são os dados — bloqueia o acesso em vez de adivinhar.
    let tenantId = null;
    try{
      const tokenResult = await user.getIdTokenResult();
      tenantId = tokenResult.claims.tenantId || null;
    }catch(e){
      console.error('Erro ao ler o token do usuário', e);
    }
    if(!tenantId){
      pendingAuthError = 'Sua conta ainda não está associada a um escritório. Faça logout e login novamente ou contate o suporte.';
      await auth.signOut();
      return;
    }
    currentTenantId = tenantId;

    currentUser = user;
    showAuthGateLoading('Carregando dados…');
    document.getElementById('headerUser').style.display = 'flex';
    document.getElementById('headerUserEmail').textContent = user.email;
    await startListening();
    hideAuthGate();
  } else {
    currentUser = null;
    currentTenantId = null;
    showAuthGateLoginCard(pendingAuthError);
    pendingAuthError = null;
  }
});

/* ---------- Firestore: le empresas do doc principal (somente leitura), grava dados proprios em tenants/{tenantId}/nfse_data/main ---------- */
function startListening(){
  return new Promise((resolve)=>{
    let mainLoaded = false, nfseLoaded = false;
    function maybeResolve(){ if(mainLoaded && nfseLoaded) resolve(true); }

    unsubMain = db.collection('appData').doc('main').onSnapshot((snap)=>{
      const data = snap.exists ? snap.data() : {};
      empresasMain = (data && data.companies) || [];
      mainLoaded = true;
      if(state) renderAll();
      maybeResolve();
    }, (err)=>{ console.error('Erro lendo empresas (appData/main)', err); mainLoaded = true; maybeResolve(); });

    unsubNfse = db.collection('tenants').doc(currentTenantId).collection('nfse_data').doc('main').onSnapshot((snap)=>{
      if(!snap.exists){
        state = { clientes: [], servicos: [], notas: [], acessosPortal: {}, empresasProprias: [] };
      } else {
        state = snap.data() || {};
        state.clientes = state.clientes || [];
        state.servicos = state.servicos || [];
        state.notas = state.notas || [];
        state.acessosPortal = state.acessosPortal || {};
        state.empresasProprias = state.empresasProprias || [];
      }
      nfseLoaded = true;
      renderAll();
      maybeResolve();
    }, (err)=>{ console.error('Erro lendo dados de NFS-e (tenants/nfse_data)', err); nfseLoaded = true; maybeResolve(); });
  });
}

// Grava só as chaves de topo (ex.: 'clientes', 'notas') que realmente mudaram,
// usando uma transação que relê o documento do servidor antes de gravar —
// evita que a edição de um usuário apague, por sobrescrita do documento
// inteiro, o que outro usuário salvou entre a leitura e a gravação.
// Lança (throw) se a gravação falhar, para quem chamou poder avisar o
// usuário e não fechar a tela como se tivesse dado certo.
async function persist(changedKeys){
  const keys = changedKeys && changedKeys.length ? changedKeys
    : ['clientes','servicos','notas','acessosPortal','empresasProprias'];
  const ref = db.collection('tenants').doc(currentTenantId).collection('nfse_data').doc('main');
  const lastEditedBy = currentUser ? currentUser.email : null;
  const lastEditedAt = new Date().toISOString();
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      const serverData = snap.exists ? (snap.data() || {}) : {};
      const merged = { ...serverData };
      keys.forEach(k=>{ merged[k] = state[k]; });
      merged.lastEditedBy = lastEditedBy;
      merged.lastEditedAt = lastEditedAt;
      tx.set(ref, merged);
    });
    state.lastEditedBy = lastEditedBy;
    state.lastEditedAt = lastEditedAt;
  }catch(e){
    console.error('Erro ao salvar (tenants/nfse_data)', e);
    alert('Não foi possível salvar: ' + (e.message || 'erro desconhecido') + '\n\nSua alteração NÃO foi gravada. Verifique sua conexão e tente novamente.');
    throw e;
  }
}

/* ---------- Confirm dialog ---------- */
function showConfirm(message, confirmLabel){
  return new Promise((resolve)=>{
    const root = document.getElementById('confirmRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="confirmOverlay" style="z-index:60;">
        <div class="modal" style="max-width:400px;">
          <h3>Confirmar</h3>
          <p style="font-size:.86rem;color:var(--ink);line-height:1.5;margin:0 0 .3rem;">${message}</p>
          <div class="modal-actions">
            <button class="btn ghost" id="confirmCancelBtn">Cancelar</button>
            <button class="btn solid-danger" id="confirmOkBtn">${confirmLabel||'Excluir'}</button>
          </div>
        </div>
      </div>`;
    const cleanup = (result)=>{ root.innerHTML=''; resolve(result); };
    document.getElementById('confirmCancelBtn').onclick = ()=>cleanup(false);
    document.getElementById('confirmOkBtn').onclick = ()=>cleanup(true);
    document.getElementById('confirmOverlay').addEventListener('click', (e)=>{ if(e.target.id==='confirmOverlay') cleanup(false); });
  });
}

/* ---------- Data helpers ---------- */
// Combina empresas vindas da Agenda de Obrigações (somente leitura) com
// empresas cadastradas diretamente aqui no módulo NFS-e (para tenants que
// não usam a Agenda). As duas convivem na mesma lista.
function todasEmpresas(){ return [...empresasMain, ...(state.empresasProprias||[])]; }
function empresaAtivaList(){ return todasEmpresas().filter(e=>e.ativa!==false).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function empresaById(id){ return todasEmpresas().find(e=>e.id===id); }
function acessoDaEmpresa(empresaId){ return (state.acessosPortal && state.acessosPortal[empresaId]) || null; }
function clienteById(id){ return state.clientes.find(c=>c.id===id); }
function servicoById(id){ return state.servicos.find(s=>s.id===id); }
function clientesDaEmpresa(empresaId){ return state.clientes.filter(c=>c.empresaId===empresaId); }
function servicosDoCliente(clienteId){ return state.servicos.filter(s=>s.clienteId===clienteId); }

function matchesSearch(text){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase().trim();
  const qDigits = q.replace(/\D/g,'');
  const textDigits = (text||'').replace(/\D/g,'');
  return (text||'').toLowerCase().includes(q) || (qDigits.length>0 && textDigits.includes(qDigits));
}

/* ---------- Stats & tabs ---------- */
const TABS = [
  {id:'empresas', label:'Empresas'},
  {id:'clientes', label:'Clientes'},
  {id:'servicos', label:'Serviços'},
  {id:'emitir', label:'Emitir NFS-e'},
];

function renderStats(){
  const pendentes = state.notas.filter(n=>n.status==='pendente_transmissao').length;
  const transmitidas = state.notas.filter(n=>n.status==='transmitida').length;
  const el = document.getElementById('statsStrip');
  el.innerHTML = `
    <div class="stat"><div class="num">${empresaAtivaList().length}</div><div class="lbl">Empresas</div></div>
    <div class="stat"><div class="num">${state.clientes.length}</div><div class="lbl">Clientes</div></div>
    <div class="stat"><div class="num accent">${pendentes}</div><div class="lbl">Pendentes de transmissão</div></div>
    <div class="stat"><div class="num">${transmitidas}</div><div class="lbl">Transmitidas</div></div>
  `;
}
function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  TABS.forEach(t=>{
    const d = document.createElement('div');
    d.className = 'tab' + (activeTab===t.id ? ' active':'');
    d.textContent = t.label;
    d.onclick = ()=>{ activeTab = t.id; renderAll(); };
    bar.appendChild(d);
  });
}

/* ================= EMPRESAS (acesso ao portal) ================= */
function renderEmpresas(){
  const list = empresaAtivaList().filter(e=>matchesSearch(e.nome+' '+e.cnpj));
  const container = document.getElementById('sheetContent');
  container.innerHTML = `
    <div class="emp-toolbar">
      <div><div class="sheet-title" style="margin-bottom:0;">Empresas</div><div class="sheet-sub" style="margin-bottom:0;">Empresas vindas da Agenda de Obrigações aparecem automaticamente (só leitura aqui). Empresas cadastradas neste módulo podem ser editadas.</div></div>
      <button class="btn accent" id="btnNewEmpresa">+ Nova empresa</button>
    </div>
    <div style="overflow-x:auto;">
    <table class="emp-table">
      <thead><tr><th>Empresa</th><th>CNPJ</th><th>Tributação</th><th>Origem</th><th>Acesso ao portal</th><th></th></tr></thead>
      <tbody>
        ${list.map(e=>{
          const acesso = acessoDaEmpresa(e.id);
          const tipo = acesso ? acesso.tipoAutenticacao : 'none';
          const label = tipo==='senha' ? 'Senha' : (tipo==='certificado' ? 'Certificado' : 'Não configurado');
          const propria = (state.empresasProprias||[]).some(p=>p.id===e.id);
          return `<tr>
            <td>${escapeHtml(e.nome)}</td>
            <td class="mono" style="font-size:.76rem;">${escapeHtml(e.cnpj)}</td>
            <td><span class="badge trib-${escapeHtml(e.trib)}">${escapeHtml(e.trib)||'—'}</span></td>
            <td><span class="badge" style="background:${propria?'#E3EEEA':'#EEF0E9'};color:${propria?'var(--ink)':'var(--muted)'};">${propria?'Cadastrada aqui':'Agenda'}</span></td>
            <td><span class="badge auth-${tipo}">${label}</span></td>
            <td style="display:flex;gap:.4rem;">
              <button class="btn ghost small" data-config="${e.id}">Configurar acesso</button>
              ${propria?`<button class="btn ghost small" data-edit-empresa="${e.id}">Editar</button>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
    ${list.length===0? '<div class="empty-note">Nenhuma empresa cadastrada ainda. Use "+ Nova empresa" acima, ou cadastre na Agenda de Obrigações Fiscais.</div>' : ''}
  `;
  container.querySelectorAll('[data-config]').forEach(b=>b.addEventListener('click', ()=>openAcessoModal(b.dataset.config)));
  container.querySelectorAll('[data-edit-empresa]').forEach(b=>b.addEventListener('click', ()=>openEmpresaModal(b.dataset.editEmpresa)));
  document.getElementById('btnNewEmpresa').addEventListener('click', ()=>openEmpresaModal(null));
}

function openEmpresaModal(empresaId){
  const editando = !!empresaId;
  const empresa = editando ? empresaById(empresaId) : { nome:'', cnpj:'', im:'', trib:'SIMPLES', ativa:true, codigoMunicipioIbge:'1302603', municipio:'Manaus/AM' };
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3>${editando ? 'Editar empresa' : 'Nova empresa'}</h3>
        <div class="form-grid">
          <div class="form-row"><label>Nome / Razão social</label><input id="fEmpNome" type="text" value="${escapeHtml(empresa.nome)}"></div>
          <div class="form-cols">
            <div class="form-row"><label>CNPJ</label><input id="fEmpCnpj" type="text" value="${escapeHtml(empresa.cnpj)}" placeholder="00.000.000/0000-00"></div>
            <div class="form-row"><label>Inscrição Municipal</label><input id="fEmpIm" type="text" value="${escapeHtml(empresa.im)}"></div>
          </div>
          <div class="form-cols">
            <div class="form-row"><label>Município</label><input id="fEmpMunicipio" type="text" value="${escapeHtml(empresa.municipio||'Manaus/AM')}"></div>
            <div class="form-row"><label>Código IBGE do município</label><input id="fEmpCodigoIbge" type="text" value="${escapeHtml(empresa.codigoMunicipioIbge||'1302603')}" placeholder="1302603"></div>
          </div>
          <div class="form-hint" style="margin-top:-.4rem;">O código do município define regras específicas (ex.: prazo de substituição de NFS-e). Deixe 1302603 (Manaus) a menos que a empresa seja de outra cidade.</div>
          <div class="form-row"><label>Regime tributário</label>
            <select id="fEmpTrib">
              <option value="SIMPLES">Simples Nacional</option>
              <option value="SIMEI">MEI</option>
              <option value="PRESUMIDO">Lucro Presumido</option>
              <option value="REAL">Lucro Real</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          ${editando?'<button class="btn danger" id="btnDeleteEmpresa" style="margin-right:auto;">Excluir</button>':''}
          <button class="btn ghost" id="btnCancel">Cancelar</button>
          <button class="btn accent" id="btnSave">Salvar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('fEmpTrib').value = empresa.trib || 'SIMPLES';
  document.getElementById('btnCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') root.innerHTML=''; });

  if(editando){
    document.getElementById('btnDeleteEmpresa').onclick = async ()=>{
      const ok = await showConfirm(`Excluir a empresa "${escapeHtml(empresa.nome)}" cadastrada aqui? Isso não afeta a Agenda de Obrigações.`, 'Excluir');
      if(!ok) return;
      const btnDel = document.getElementById('btnDeleteEmpresa');
      btnDel.disabled = true;
      const backup = state.empresasProprias;
      state.empresasProprias = (state.empresasProprias||[]).filter(e=>e.id!==empresaId);
      try{
        await persist(['empresasProprias']);
      }catch(e){
        state.empresasProprias = backup;
        btnDel.disabled = false;
        return;
      }
      root.innerHTML = '';
      renderAll();
    };
  }

  document.getElementById('btnSave').onclick = async ()=>{
    const btnSave = document.getElementById('btnSave');
    if(btnSave.disabled) return; // evita duplo clique criando registro duplicado
    const nome = document.getElementById('fEmpNome').value.trim();
    if(!nome){ alert('Informe o nome da empresa.'); return; }
    btnSave.disabled = true;
    if(!state.empresasProprias) state.empresasProprias = [];
    const municipio = document.getElementById('fEmpMunicipio').value.trim();
    const codigoMunicipioIbge = document.getElementById('fEmpCodigoIbge').value.trim();
    const backup = state.empresasProprias.slice();
    if(editando){
      const idx = state.empresasProprias.findIndex(e=>e.id===empresaId);
      if(idx>=0){
        state.empresasProprias[idx] = {
          ...state.empresasProprias[idx],
          nome, cnpj: document.getElementById('fEmpCnpj').value.trim(),
          im: document.getElementById('fEmpIm').value.trim(),
          trib: document.getElementById('fEmpTrib').value,
          municipio, codigoMunicipioIbge,
        };
      }
    } else {
      state.empresasProprias.push({
        id: uid('emp_'), nome, cnpj: document.getElementById('fEmpCnpj').value.trim(),
        im: document.getElementById('fEmpIm').value.trim(),
        trib: document.getElementById('fEmpTrib').value,
        municipio, codigoMunicipioIbge,
        ativa: true,
      });
    }
    try{
      await persist(['empresasProprias']);
    }catch(e){
      state.empresasProprias = backup;
      btnSave.disabled = false;
      return;
    }
    root.innerHTML = '';
    renderAll();
  };
}

/* ================= CLIENTES ================= */

            <td class="mono" style="font-size:.76rem;">${escapeHtml(c.cnpjCpf)}</td>

          <div class="form-cols">
            <div class="form-row"><label>E-mail</label><input id="fEmail" type="email" value="${escapeHtml(c.email)}"></div>
            <div class="form-row"><label>Telefone</label><input id="fTelefone" type="text" value="${escapeHtml(c.telefone)}"></div>

          <div class="form-cols">
            <div class="form-row"><label>Município</label><input id="fMunicipio" type="text" value="${escapeHtml(c.municipio)}"></div>
            <div class="form-row"><label>UF</label><input id="fUf" type="text" maxlength="2" value="${escapeHtml(c.uf)}"></div>
          </div>
          <div class="form-row"><label>Inscrição Municipal (se houver)</label><input id="fIm" type="text" value="${escapeHtml(c.inscricaoMunicipal)}"></div>
          <div class="auth-block">
            <div class="form-hint" style="margin-top:0;">Necessário só se essa empresa emitir pela API oficial (certificado digital).</div>
            <div class="form-cols">
              <div class="form-row"><label>Código IBGE do município (7 dígitos)</label><input id="fCodigoIbge" type="text" value="${escapeHtml(c.codigoIbge)}" placeholder="ex: 1302603"></div>
              <div class="form-row"><label>CEP</label><input id="fCep" type="text" value="${escapeHtml(c.cep)}"></div>
            </div>
            <div class="form-cols">
              <div class="form-row"><label>Logradouro</label><input id="fLogradouro" type="text" value="${escapeHtml(c.logradouro)}"></div>
              <div class="form-row"><label>Número</label><input id="fNumero" type="text" value="${escapeHtml(c.numero)}"></div>
            </div>
            <div class="form-row"><label>Bairro</label><input id="fBairro" type="text" value="${escapeHtml(c.bairro)}"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="btnCancel">Cancelar</button>
          <button class="btn accent" id="btnSave">Salvar</button>

  document.getElementById('fTipoPessoa').value = c.tipoPessoa;
  document.getElementById('btnCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') root.innerHTML=''; });
  document.getElementById('btnSave').onclick = async ()=>{
    const btnSave = document.getElementById('btnSave');
    if(btnSave.disabled) return;
    const nomeRazaoSocial = document.getElementById('fNome').value.trim();
    const cnpjCpf = document.getElementById('fCnpjCpf').value.trim();
    if(!nomeRazaoSocial || !cnpjCpf){ alert('Preencha ao menos o nome e o CNPJ/CPF.'); return; }
    btnSave.disabled = true;
    const data = {
      empresaId: document.getElementById('fEmpresaId').value,
      tipoPessoa: document.getElementById('fTipoPessoa').value,
      nomeRazaoSocial, cnpjCpf,
      email: document.getElementById('fEmail').value.trim(),
      telefone: document.getElementById('fTelefone').value.trim(),

      numero: document.getElementById('fNumero').value.trim(),
      bairro: document.getElementById('fBairro').value.trim(),
    };

    else { state.clientes.push({id: uid('cli_'), ...data}); }
    try{
      await persist(['clientes']);
    }catch(e){
      state.clientes = backup;
      btnSave.disabled = false;
      return;
    }
    root.innerHTML = '';
    renderAll();
  };
}

async function deleteCliente(id){
  const c = clienteById(id);
  if(!c) return;
  const ok = await showConfirm(`Excluir "${escapeHtml(c.nomeRazaoSocial)}"? Isso também excluirá os serviços cadastrados para ele.`);
  if(!ok) return;
  const backupServicos = state.servicos, backupNotas = state.notas, backupClientes = state.clientes;
  state.servicos = state.servicos.filter(s=>s.clienteId!==id);
  state.notas = state.notas.filter(n=>n.clienteId!==id);
  state.clientes = state.clientes.filter(x=>x.id!==id);
  try{
    await persist(['clientes','servicos','notas']);
  }catch(e){
    state.servicos = backupServicos; state.notas = backupNotas; state.clientes = backupClientes;
    return;
  }
  renderAll();
}

async function deleteServico(id){
  const ok = await showConfirm('Excluir este serviço do catálogo do cliente?');
  if(!ok) return;
  const backup = state.servicos;
  state.servicos = state.servicos.filter(x=>x.id!==id);
  try{
    await persist(['servicos']);
  }catch(e){
    state.servicos = backup;
    return;
  }
  renderAll();
}

function statusLabel(status){ return {rascunho:'Rascunho', pendente_transmissao:'Pendente', transmitida:'Transmitida', erro:'Erro', transmitindo:'Transmitindo…', substituida:'Substituída'}[status] || status; }

function downloadBlob(blob, nomeArquivo){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

async function baixarXmlNota(notaId, botao){
  const nota = state.notas.find(n=>n.id===notaId);
  if(!nota) return;
  if(botao){ botao.disabled = true; botao.textContent = 'Buscando…'; }
  try{
    const obterXml = functionsClient.httpsCallable('obter_xml_nfse', { timeout: 170000 });
    const resultado = await obterXml({ notaId });
    if(resultado.data && resultado.data.sucesso){
      const blob = new Blob([resultado.data.xml], {type:'application/xml'});
      downloadBlob(blob, `NFSe_${nota.numeroNfse || notaId}.xml`);
    } else {
      alert('Não foi possível obter o XML: ' + (resultado.data ? resultado.data.erro : 'erro desconhecido'));
    }
  }catch(e){
    alert('Erro ao buscar o XML: ' + e.message);
  } finally {
    if(botao){ botao.disabled = false; botao.textContent = 'Baixar XML'; }
  }
}

async function verPdfNota(notaId, botao){
  const nota = state.notas.find(n=>n.id===notaId);
  if(!nota) return;
  if(botao){ botao.disabled = true; botao.textContent = 'Gerando PDF…'; }
  try{
    const obterPdf = functionsClient.httpsCallable('baixar_danfse_pdf', { timeout: 170000 });
    const resultado = await obterPdf({ notaId });
    if(resultado.data && resultado.data.sucesso){
      const byteChars = atob(resultado.data.pdfBase64);
      const byteNumbers = new Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
      const blob = new Blob([new Uint8Array(byteNumbers)], {type:'application/pdf'});
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
    } else {
      alert('Não foi possível gerar o PDF: ' + (resultado.data ? resultado.data.erro : 'erro desconhecido'));
    }
  }catch(e){
    alert('Erro ao gerar o PDF: ' + e.message);
  } finally {
    if(botao){ botao.disabled = false; botao.textContent = 'Ver PDF (DANFSe)'; }
  }
}

async function transmitirNota(notaId, botao){
  const nota = state.notas.find(n=>n.id===notaId);
  if(!nota) return;
  const acesso = acessoDaEmpresa(nota.empresaId);

  if(acesso && acesso.tipoAutenticacao === 'certificado'){
    // Transmissao direta via Cloud Function - nao depende do script local.
    if(botao){ botao.disabled = true; botao.textContent = 'Transmitindo…'; }
    try{
      const transmitir = functionsClient.httpsCallable('transmitir_nfse');
      const resultado = await transmitir({ notaId });
      if(!resultado.data || !resultado.data.sucesso){
        alert('Não foi possível transmitir: ' + (resultado.data ? resultado.data.erro : 'erro desconhecido'));
      } else if(resultado.data.avisoAmbiente){
        // Aviso crítico: o portal confirmou um ambiente diferente do configurado
        // (ex: nota que deveria ser homologação saiu como produção de verdade).
        alert('⚠️ ' + resultado.data.avisoAmbiente);
      }
      // O Firestore listener (onSnapshot) atualiza o card sozinho com o status novo.
    }catch(e){
      alert('Erro ao chamar a transmissão: ' + e.message);
      if(botao){ botao.disabled = false; botao.textContent = 'Transmitir'; }
    }
  } else {
    // Empresa por senha - continua no fluxo antigo (script local com Playwright).
    nota.status = 'pendente_transmissao';
    nota.mensagemErro = null;
    persist(['notas']).catch(()=>{}); // erro já mostrado em alert() dentro de persist()
    renderAll();
  }
}

/* ================= SUBSTITUIÇÃO DE NFS-e ================= */
// O prazo para cancelamento por substituição VARIA POR MUNICÍPIO (cada
// município aderente ao Ambiente Nacional define sua própria regra).
// Manaus/AM: até 9 dias, contados do dia seguinte à emissão (regra da SEMEF).
// Isso é só um aviso visual na tela — a validação que vale de verdade é a
// do backend (substituir_nfse), que já considera o município da empresa.
const PRAZO_DIAS_SUBSTITUICAO_PADRAO = 9; // Manaus, hoje a única cidade em uso

function diasDesdeEmissao(nota){
  const dataStr = nota.transmitidaEm || nota.criadaEm;
  if(!dataStr) return null;
  const diffMs = new Date() - new Date(dataStr);
  return Math.floor(diffMs / (1000*60*60*24));
}
function podeSubstituir(nota){
  const dias = diasDesdeEmissao(nota);
  return dias===null || dias <= PRAZO_DIAS_SUBSTITUICAO_PADRAO;
}

}

}

                <option value="03">03 - Inclusão retroativa de imunidade/isenção</option>
                <option value="04">04 - Exclusão retroativa de imunidade/isenção</option>
                <option value="05">05 - Rejeição pelo tomador/intermediário</option>
                <option value="99" selected>99 - Outros</option>
              </select>
            </div>
            <div class="form-row"><label>Detalhe do motivo (opcional)</label><textarea id="fMotivoTexto" rows="2" placeholder="Ex.: erro no valor do serviço."></textarea></div>
          ` : ''}
          <button class="btn accent" id="btnCriarNota" style="align-self:flex-start;">${notaAntiga ? 'Transmitir substituição' : 'Salvar rascunho'}</button>
        </div>
      </div>
      <div>
        <div class="sheet-title" style="font-size:1rem;">Fila de notas</div>
        <div id="notasList"></div>
      </div>
    </div>
  `;
  if(notaAntiga){
    document.getElementById('btnCancelarSubstituicao').addEventListener('click', cancelarSubstituicao);
  }
  const empresaSelect = document.getElementById('fEmpresaId');
  const clienteSelect = document.getElementById('fClienteId');
  const servicoSelect = document.getElementById('fServicoId');

  function refreshClientes(){
    const empId = empresaSelect.value;
    const clientes = clientesDaEmpresa(empId);
    clienteSelect.innerHTML = clientes.map(c=>`<option value="${c.id}">${escapeHtml(c.nomeRazaoSocial)}</option>`).join('') || '<option value="">— nenhum cliente para esta empresa —</option>';
    refreshServicos();
  }
  function refreshServicos(){
    const cliId = clienteSelect.value;
    servicoSelect.innerHTML = '<option value="">— preencher manualmente —</option>' +
      servicosDoCliente(cliId).map(s=>{ const desc = s.descricao||''; return `<option value="${s.id}">${escapeHtml(desc.slice(0,40))}${desc.length>40?'…':''}</option>`; }).join('');
  }
  empresaSelect.addEventListener('change', refreshClientes);
  clienteSelect.addEventListener('change', refreshServicos);
  servicoSelect.addEventListener('change', ()=>{
    const s = servicoById(servicoSelect.value);
    if(s){
      if(s.valorPadrao!=null) document.getElementById('fValor').value = s.valorPadrao;
      if(s.tipoDescricao==='mensal') atualizarDescricaoAutomatica();
      else document.getElementById('fDescricaoServico').value = s.descricao;
    }
  });
  function atualizarDescricaoAutomatica(){
    const s = servicoById(servicoSelect.value);
    if(!s || s.tipoDescricao!=='mensal') return;
    const valor = parseFloat(document.getElementById('fValor').value) || 0;
    const dataCompetencia = document.getElementById('fData').value;
    document.getElementById('fDescricaoServico').value = gerarDescricaoMensal(s, dataCompetencia, valor);
  }
  document.getElementById('fData').addEventListener('change', atualizarDescricaoAutomatica);
  document.getElementById('fValor').addEventListener('input', atualizarDescricaoAutomatica);
  refreshClientes();

  if(notaAntiga){
    // Modo substituição: pré-preenche com os dados da nota antiga.
    empresaSelect.value = notaAntiga.empresaId;
    refreshClientes();
    clienteSelect.value = notaAntiga.clienteId;
    refreshServicos();
    if(notaAntiga.servicoId) servicoSelect.value = notaAntiga.servicoId;
    document.getElementById('fData').value = notaAntiga.dataCompetencia || new Date().toISOString().slice(0,10);
    document.getElementById('fDescricaoServico').value = notaAntiga.descricaoServico || '';
    document.getElementById('fValor').value = notaAntiga.valor || '';
  } else {
    document.getElementById('fData').value = new Date().toISOString().slice(0,10);
  }

  document.getElementById('btnCriarNota').addEventListener('click', async ()=>{
    const empresaId = empresaSelect.value;
    const clienteId = clienteSelect.value;
    const descricaoServico = document.getElementById('fDescricaoServico').value.trim();
    const valor = parseFloat(document.getElementById('fValor').value);
    const dataCompetencia = document.getElementById('fData').value;
    if(!empresaId || !clienteId){ alert('Selecione empresa e cliente.'); return; }
    if(!descricaoServico){ alert('Descreva o serviço prestado.'); return; }
    if(!valor || valor<=0){ alert('Informe um valor válido.'); return; }
    const servicoEscolhido = servicoById(servicoSelect.value);
    const novaNota = {
      id: uid('nota_'), empresaId, clienteId, servicoId: servicoSelect.value || null,
      descricaoServico, valor, dataCompetencia, status: 'rascunho',
      ...camposFiscaisDoServico(servicoEscolhido),
      criadaEm: new Date().toISOString(), transmitidaEm: null, numeroNfse: null, mensagemErro: null,
      criadaPor: currentUser ? currentUser.email : null,
    };

    if(!notaAntiga){
      // Fluxo normal: só salva o rascunho.
      const backup = state.notas.slice();
      state.notas.push(novaNota);
      try{
        await persist(['notas']);
      }catch(e){
        state.notas = backup;
        return;
      }
      renderAll();
      return;
    }

    // Fluxo de substituição: cria a nota nova, transmite, e se der certo,
    // registra o cancelamento-por-substituição vinculando as duas.
    const motivoCodigo = document.getElementById('fMotivoCodigo').value;
    const motivoTexto = document.getElementById('fMotivoTexto').value.trim();
    const btn = document.getElementById('btnCriarNota');
    btn.disabled = true; btn.textContent = 'Emitindo nota nova…';

    const backupNotas = state.notas.slice();
    state.notas.push(novaNota);
    try{
      await persist(['notas']);
    }catch(e){
      state.notas = backupNotas;
      btn.disabled = false; btn.textContent = 'Transmitir substituição';
      return;
    }

    try{
      const transmitir = functionsClient.httpsCallable('transmitir_nfse', { timeout: 170000 });
      const resTransmissao = await transmitir({ notaId: novaNota.id });
      if(!resTransmissao.data || !resTransmissao.data.sucesso){
        alert('A nota nova não foi transmitida: ' + (resTransmissao.data ? resTransmissao.data.erro : 'erro desconhecido') + '\n\nA substituição não foi registrada. O rascunho da nota nova continua na fila para você tentar de novo.');
        btn.disabled = false; btn.textContent = 'Transmitir substituição';
        renderAll();
        return;
      }
      if(resTransmissao.data.avisoAmbiente){
        alert('⚠️ ' + resTransmissao.data.avisoAmbiente);
      }

      btn.textContent = 'Vinculando substituição…';
      const substituir = functionsClient.httpsCallable('substituir_nfse', { timeout: 170000 });
      const resSubst = await substituir({
        notaIdAntiga: notaAntiga.id, notaIdNova: novaNota.id, motivoCodigo, motivoTexto,
      });
      if(!resSubst.data || !resSubst.data.sucesso){
        alert('A nota nova foi transmitida com sucesso, mas não foi possível registrar o cancelamento da nota antiga por substituição: ' +
          (resSubst.data ? resSubst.data.erro : 'erro desconhecido') +
          '\n\nA nota antiga continua ativa — você pode tentar vincular de novo depois.');
      }

      substituicaoPendente = null;
      renderAll();
    }catch(e){
      alert('Erro durante a substituição: ' + e.message);
      btn.disabled = false; btn.textContent = 'Transmitir substituição';
    }
  });

  renderNotasList(notas);

  const btnGerarLote = document.getElementById('btnGerarLote');
  if(btnGerarLote) btnGerarLote.addEventListener('click', async ()=>{
    const clientesComServicoMensal = state.clientes.filter(c=>{
      if(c.ativo===false) return false;
      return state.servicos.some(s=>s.clienteId===c.id && s.tipoDescricao==='mensal');
    });
    if(clientesComServicoMensal.length===0){
      alert('Nenhum cliente com um serviço "Automático (mensal)" cadastrado ainda.');
      return;
    }
    const ok = await showConfirm(`Gerar um rascunho de NFS-e para ${clientesComServicoMensal.length} cliente(s), com competência de ${new Date().toLocaleDateString('pt-BR', {month:'long', year:'numeric'})}?`, 'Gerar rascunhos');
    if(!ok) return;
    const hoje = new Date();
    const dataCompetencia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString().slice(0,10);
    let criados = 0;
    clientesComServicoMensal.forEach(cliente=>{
      const servico = state.servicos.find(s=>s.clienteId===cliente.id && s.tipoDescricao==='mensal');
      const valor = servico.valorPadrao || 0;
      if(!valor){ return; } // pula clientes sem valor padrão definido no serviço
      const descricaoServico = gerarDescricaoMensal(servico, dataCompetencia, valor);
      state.notas.push({
        id: uid('nota_'), empresaId: cliente.empresaId, clienteId: cliente.id, servicoId: servico.id,
        descricaoServico, valor, dataCompetencia, status: 'rascunho',
        ...camposFiscaisDoServico(servico),
        criadaEm: new Date().toISOString(), transmitidaEm: null, numeroNfse: null, mensagemErro: null,
        criadaPor: currentUser ? currentUser.email : null,
      });
      criados++;
    });
    try{
      await persist(['notas']);
    }catch(e){
      return;
    }
    renderAll();
    alert(`${criados} rascunho(s) criado(s). Clientes sem "Valor padrão" no serviço foram pulados — configure o valor na aba Serviços.`);
  });
}

function renderNotasList(notas){
  const el = document.getElementById('notasList');
  if(!el) return;
  if(notas.length===0){ el.innerHTML = '<div class="empty-note">Nenhuma nota na fila ainda.</div>'; return; }
  el.innerHTML = notas.map(n=>{
    const emp = empresaById(n.empresaId);
    const cli = clienteById(n.clienteId);
    return `<div class="nota-card">
      <div class="nota-top">
        <div>
          <div class="nota-name">${cli? escapeHtml(cli.nomeRazaoSocial) : '(cliente removido)'}</div>
          <div class="nota-meta">${emp? escapeHtml(emp.nome) : ''} · ${escapeHtml(n.dataCompetencia)}</div>
        </div>
        <div style="text-align:right;">
          <div class="nota-valor">R$ ${Number(n.valor).toFixed(2)}</div>
          <span class="badge status-${n.status}">${statusLabel(n.status)}</span>
        </div>
      </div>
      <div class="nota-meta">${escapeHtml(n.descricaoServico)}</div>
      ${n.numeroNfse? `<div class="nota-meta">Nº NFS-e: <strong>${escapeHtml(n.numeroNfse)}</strong></div>` : ''}
      ${n.mensagemErro? `<div class="nota-msg">${escapeHtml(n.mensagemErro)}</div>` : ''}
      ${n.avisoAmbiente? `<div class="nota-msg" style="background:#FFF3CD;color:#7A5D00;border:1px solid #F0D98C;">⚠️ ${escapeHtml(n.avisoAmbiente)}</div>` : ''}
      ${n.status==='substituida'? `<div class="nota-meta">Substituída pela nota <strong>${escapeHtml(n.substituidaPorChave)}</strong></div>` : ''}
      <div style="margin-top:.5rem; display:flex; gap:.5rem; flex-wrap:wrap;">
        ${n.status==='rascunho' ? `<button class="btn accent small" data-transmitir="${n.id}">Transmitir</button>` : ''}
        ${n.status==='erro' ? `<button class="btn accent small" data-retransmitir="${n.id}">Tentar de novo</button>` : ''}
        ${n.status==='transmitida' ? `<button class="btn ghost small" data-baixar-xml="${n.id}">Baixar XML</button>` : ''}
        ${n.status==='transmitida' ? `<button class="btn ghost small" data-ver-pdf="${n.id}">Ver PDF (DANFSe)</button>` : ''}
        ${n.status==='transmitida' && podeSubstituir(n) ? `<button class="btn ghost small" data-substituir="${n.id}">Substituir</button>` : ''}
        ${n.status==='transmitida' && !podeSubstituir(n) ? `<span class="badge" title="Prazo de ${PRAZO_DIAS_SUBSTITUICAO_PADRAO} dias para substituição já passou">Fora do prazo p/ substituir</span>` : ''}
        <button class="btn danger small" data-del-nota="${n.id}">${n.status==='rascunho' ? 'Excluir rascunho' : 'Remover da fila'}</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-transmitir]').forEach(b=>{
    b.addEventListener('click', ()=>transmitirNota(b.dataset.transmitir, b));
  });
  el.querySelectorAll('[data-retransmitir]').forEach(b=>{
    b.addEventListener('click', ()=>transmitirNota(b.dataset.retransmitir, b));
  });
  el.querySelectorAll('[data-baixar-xml]').forEach(b=>{
    b.addEventListener('click', ()=>baixarXmlNota(b.dataset.baixarXml, b));
  });
  el.querySelectorAll('[data-ver-pdf]').forEach(b=>{
    b.addEventListener('click', ()=>verPdfNota(b.dataset.verPdf, b));
  });
  el.querySelectorAll('[data-substituir]').forEach(b=>{
    b.addEventListener('click', ()=>iniciarSubstituicao(b.dataset.substituir));
  });
  el.querySelectorAll('[data-del-nota]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const ok = await showConfirm('Remover esta nota da fila?');
      if(!ok) return;
      const backup = state.notas;
      state.notas = state.notas.filter(n=>n.id!==b.dataset.delNota);
      try{
        await persist(['notas']);
      }catch(e){
        state.notas = backup;
        return;
      }
      renderAll();
    });
  });
}

/* ---------- Master render ---------- */
function renderAll(){
  if(!state) return;
  renderStats();
  renderTabs();
  if(activeTab==='empresas') renderEmpresas();
  else if(activeTab==='clientes') renderClientes();
  else if(activeTab==='servicos') renderServicos();
  else if(activeTab==='emitir') renderEmitir();
}

document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value; renderAll(); });

})();
</script>
</body>
