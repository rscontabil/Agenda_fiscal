<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Obrigações Fiscais</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#132A3A">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda Fiscal">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#132A3A;
  --ink-2:#0B4A45;
  --paper:#E9EEE6;
  --surface:#FFFFFF;
  --line:#D7DCD1;
  --line-strong:#B9C1B4;
  --accent:#C1692B;
  --accent-2:#9C5322;
  --good:#2E7D5B;
  --good-bg:#E3F1E9;
  --bad:#B23A34;
  --bad-bg:#FBEAE9;
  --muted:#5C6B67;
  --gold:#9C7A2E;
  --gold-bg:#F3ECD9;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px);
  background-size: 100% 2.1em;
  background-position: 0 7.2em;
}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
.display{font-family:'Fraunces', Georgia, serif;}

/* ===== Header ===== */
header.app{
  background:var(--ink);
  color:#F2F0E6;
  padding:1.1rem 1.4rem 1.3rem;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.header-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:1rem;
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:.7rem;}
.brand-mark{
  width:38px;height:38px;border-radius:8px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif; font-weight:700; font-size:1.1rem; color:#1A140D;
  flex-shrink:0;
  transform:rotate(-3deg);
}
.brand h1{
  font-family:'Fraunces',serif;
  font-size:1.35rem;
  margin:0;
  font-weight:600;
  letter-spacing:.2px;
}
.brand p{margin:.15rem 0 0; font-size:.78rem; color:#B9C4BE; letter-spacing:.3px;}

.controls{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;}
.controls input[type=month], .controls select, .controls input[type=number]{
  background:#0E3B47;
  border:1px solid #2C5A5C;
  color:#F2F0E6;
  padding:.5rem .7rem;
  border-radius:8px;
  font-family:'Public Sans',sans-serif;
  font-size:.85rem;
}
.search-box{position:relative;}
.drive-status{display:flex; align-items:center; cursor:pointer;}
.search-box input{
  background:#0E3B47;
  border:1px solid #2C5A5C;
  color:#F2F0E6;
  padding:.5rem .7rem .5rem 2rem;
  border-radius:8px;
  font-size:.85rem;
  width:200px;
}
.search-box input::placeholder{color:#8FA39D;}
.search-box svg{position:absolute; left:.55rem; top:50%; transform:translateY(-50%); opacity:.6;}

.stats-strip{
  display:flex; gap:1.6rem; margin-top:.9rem; flex-wrap:wrap;
}
.stat{display:flex; flex-direction:column; gap:.1rem;}
.stat.clickable{cursor:pointer; transition:opacity .12s;}
.stat.clickable:hover{opacity:.65;}

.auth-gate{
  position:fixed; inset:0; background:var(--bg,#F5F3EC); display:flex; align-items:center; justify-content:center;
  z-index:300; padding:1rem;
}
.auth-gate-card{
  background:#fff; border-radius:16px; padding:2.2rem 2rem; max-width:360px; width:100%;
  text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.12);
}
.auth-gate-card h2{font-family:'Fraunces',serif; font-size:1.25rem; margin:.2rem 0 .5rem;}
.auth-gate-card p{font-size:.86rem; color:var(--muted); line-height:1.5; margin:0 0 1.2rem;}
.auth-gate-error{color:var(--bad); font-size:.8rem; margin-top:.9rem; min-height:1em;}
.auth-gate-spinner{
  width:36px; height:36px; margin:0 auto;
  border:3px solid var(--line-strong); border-top-color:var(--accent);
  border-radius:50%; animation:authSpin .8s linear infinite;
}
@keyframes authSpin{ to{ transform:rotate(360deg); } }
.header-user{display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--muted);}
.header-user button{
  background:none; border:1px solid var(--line-strong); border-radius:20px; padding:.25rem .7rem;
  font-size:.74rem; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Public Sans',sans-serif;
}
.header-user button:hover{background:#F2F0E6;}
.header-install-btn{
  background:none; border:1px solid var(--line-strong); border-radius:20px; padding:.25rem .8rem;
  font-size:.74rem; font-weight:600; color:var(--muted); cursor:pointer; font-family:'Public Sans',sans-serif;
}
.header-install-btn:hover{background:#F2F0E6;}
.stat .num{font-family:'Fraunces',serif; font-size:1.5rem; font-weight:600; color:#F2F0E6;}
.stat .lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:#9FB2AB;}
.stat .num.accent{color:var(--accent);}

/* ===== Tabs (sheet-tab signature) ===== */
.tabbar{
  display:flex;
  gap:2px;
  padding:0 1.1rem;
  background:var(--ink);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tab{
  position:relative;
  padding:.6rem 1.15rem .55rem;
  font-size:.82rem;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  color:#B9C4BE;
  background:#0E2836;
  clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
  transition:background .15s, color .15s;
  user-select:none;
}
.tab:hover{color:#F2F0E6;}
.tab-badge{
  display:inline-block; margin-left:.4rem; background:var(--bad); color:#fff;
  font-size:.68rem; font-weight:700; padding:.05rem .4rem; border-radius:10px;
}
.tab.active{
  background:var(--paper);
  color:var(--ink);
}

/* ===== Main ===== */
main{padding:1.4rem;max-width:1180px;margin:0 auto;}
.sheet{
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:0 8px 8px 8px;
  padding:1.3rem;
  box-shadow:0 1px 3px rgba(20,40,35,.06);
}
.sheet-title{
  font-family:'Fraunces',serif;
  font-size:1.15rem;
  font-weight:600;
  margin:0 0 .2rem;
}
.sheet-sub{font-size:.82rem; color:var(--muted); margin:0 0 1.1rem;}

/* ===== Company cards ===== */
.company-list{display:flex; flex-direction:column; gap:.7rem;}
.card{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:.85rem 1rem;
  background:#FCFCFA;
  transition:box-shadow .15s;
}
.card:hover{box-shadow:0 2px 8px rgba(20,40,35,.07);}
.card-top{
  display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap;
}
.card-name{font-weight:600; font-size:.95rem; line-height:1.3;}
.card-meta{display:flex; gap:.4rem; align-items:center; margin-top:.25rem; flex-wrap:wrap;}
.cnpj{font-size:.72rem; color:var(--muted);}
.badge{
  font-size:.65rem; font-weight:600; padding:.15rem .5rem; border-radius:20px;
  text-transform:uppercase; letter-spacing:.04em;
}
.badge.trib-SIMPLES, .badge.trib-SIMEI{background:var(--gold-bg); color:var(--gold);}
.badge.trib-PRESUMIDO{background:#E5EEF3; color:#2A5F79;}
.badge.trib-REAL{background:#EFE3F0; color:#7A3E7D;}
.badge.ativ{background:#EEF0E9; color:var(--muted);}

.progress-wrap{display:flex; align-items:center; gap:.55rem; min-width:150px;}
.progress-bar{
  width:110px; height:7px; border-radius:6px; background:var(--line); overflow:hidden;
}
.progress-fill{height:100%; background:var(--accent); border-radius:6px; transition:width .25s;}
.progress-fill.done{background:var(--good);}
.progress-pct{font-size:.76rem; font-weight:600; color:var(--muted); font-family:'IBM Plex Mono',monospace; min-width:34px; text-align:right;}

.stamp{
  font-family:'Fraunces',serif; font-weight:700; font-size:.62rem; letter-spacing:.06em;
  color:var(--good); border:1.5px dashed var(--good); border-radius:6px;
  padding:.15rem .4rem; transform:rotate(-4deg); text-transform:uppercase;
}

.items-row{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.7rem;}
.mei-actions{display:flex; gap:.5rem; margin-top:.6rem; flex-wrap:wrap;}
.item-pill{
  display:flex; align-items:center; gap:.4rem;
  border:1px solid var(--line); border-radius:20px;
  padding:.32rem .65rem .32rem .5rem;
  font-size:.78rem; cursor:pointer; background:#fff;
  transition:background .12s, border-color .12s;
}
.item-pill:hover{border-color:var(--line-strong);}
.item-pill input{accent-color:var(--good); width:14px; height:14px; cursor:pointer;}
.item-pill.checked{background:var(--good-bg); border-color:#BFE0CD; color:var(--good); font-weight:600;}
.item-pill.checked span.tick{color:var(--good);}

.empty-note{color:var(--muted); font-size:.85rem; padding:1.5rem 0; text-align:center;}

/* ===== Painel ===== */
.painel-header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:.8rem; flex-wrap:wrap; margin-bottom:1rem;}
.painel-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.9rem; margin-bottom:1.4rem;}
.painel-card{
  border:1px solid var(--line); border-radius:var(--radius); padding:1rem; background:#FCFCFA;
}
.painel-card.clickable{cursor:pointer; transition:border-color .12s, background .12s;}
.painel-card.clickable:hover{border-color:var(--accent); background:#F8F7F2;}
.painel-card .num{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600;}
.painel-card .lbl{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:.15rem;}
.painel-card .sub{font-size:.72rem; color:var(--muted); margin-top:.5rem; display:flex; flex-direction:column; gap:.15rem;}

.pending-list{display:flex; flex-direction:column; gap:.5rem;}
.pending-row{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  border:1px solid var(--line); border-radius:8px; padding:.55rem .8rem; background:#FCFCFA;
}
.pending-row .name{font-size:.85rem; font-weight:600;}
.pending-row .go{
  font-size:.72rem; font-weight:600; color:var(--accent); cursor:pointer; white-space:nowrap;
}
.pending-row .go:hover{text-decoration:underline;}

.lembrete-list{display:flex; flex-direction:column; gap:.55rem;}
.lembrete-row{
  display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  border:1px solid var(--line); border-radius:10px; padding:.7rem .9rem; background:#FCFCFA;
}
.lembrete-row.overdue{background:var(--bad-bg); border-color:#E3A0A0;}
.lembrete-info .name{font-size:.87rem; font-weight:600;}
.lembrete-info .meta{font-size:.76rem; color:var(--muted); margin-top:.2rem;}
.lembrete-row.overdue .meta strong{color:var(--bad);}
.lembrete-actions{display:flex; gap:.5rem; flex-shrink:0;}

/* ===== Empresas (CRUD) ===== */
.emp-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:.7rem; flex-wrap:wrap;}
.btn{
  background:var(--ink); color:#F2F0E6; border:none; padding:.55rem 1rem;
  border-radius:8px; font-size:.82rem; font-weight:600; cursor:pointer;
  font-family:'Public Sans',sans-serif;
}
.btn:hover{background:#0E3B47;}
.btn.accent{background:var(--accent);}
.btn.accent:hover{background:var(--accent-2);}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line-strong);}
.btn.ghost:hover{background:#F2F0E6;}
.btn.small{padding:.35rem .65rem; font-size:.74rem;}
.btn.danger{background:transparent; color:var(--bad); border:1px solid #E8C6C4;}
.btn.danger:hover{background:var(--bad-bg);}
.btn.solid-danger{background:var(--bad); color:#fff;}
.btn.solid-danger:hover{background:#8F2E29;}

table.emp-table{width:100%; border-collapse:collapse; font-size:.83rem;}
table.emp-table th{
  text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); padding:.5rem .5rem; border-bottom:2px solid var(--line-strong);
}
table.emp-table td{padding:.55rem .5rem; border-bottom:1px solid var(--line); vertical-align:middle;}
table.emp-table tr:hover td{background:#FBFAF6;}
.flags{display:flex; gap:.3rem;}
.flag-dot{
  width:20px;height:20px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  font-size:.62rem; font-weight:700; color:#fff; opacity:.25;
}
.flag-dot.on{opacity:1;}
.flag-dot.folha{background:#2A5F79;}
.flag-dot.contab{background:var(--good);}
.flag-dot.suframa{background:var(--gold);}

.modal-overlay{
  position:fixed; inset:0; background:rgba(19,42,58,.45); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:1rem;
}
.modal{
  background:#fff; border-radius:12px; padding:1.4rem; width:100%; max-width:560px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
  max-height:88vh; overflow-y:auto;
}
.modal h3{font-family:'Fraunces',serif; margin:0 0 1rem; font-size:1.1rem;}
.form-grid{display:flex; flex-direction:column; gap:.7rem;}
.form-row{display:flex; flex-direction:column; gap:.3rem;}
.form-row label{font-size:.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.form-row input, .form-row select{
  padding:.5rem .6rem; border:1px solid var(--line-strong); border-radius:7px; font-size:.85rem;
  font-family:'Public Sans',sans-serif;
}
.form-cols{display:flex; gap:.7rem;}
.form-cols .form-row{flex:1;}
.modal-actions{display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.2rem;}

.oblig-section-title{font-family:'Fraunces',serif; font-size:1rem; font-weight:600; margin:.4rem 0 0;}
.oblig-section-sub{font-size:.76rem; color:var(--muted); margin:.1rem 0 .3rem;}
.oblig-regime-label{font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-2); margin:.2rem 0 .35rem;}
.oblig-toggles{display:flex; gap:1.2rem; flex-wrap:wrap; margin:.9rem 0 .2rem; padding-top:.7rem; border-top:1px dashed var(--line-strong);}
.oblig-toggle{display:flex; align-items:center; gap:.4rem; font-size:.83rem; font-weight:600; color:var(--ink); cursor:pointer; text-transform:none;}
.oblig-toggle input{width:15px; height:15px; accent-color:var(--accent); cursor:pointer;}
.oblig-toggle-block{margin-top:.2rem; margin-bottom:.2rem;}
.oblig-group{border:1px solid var(--line); border-radius:8px; padding:.65rem .75rem; margin-bottom:.55rem; background:#FCFCFA;}

.config-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:1rem;}

.envio-warn{
  background:var(--gold-bg); color:#7A5F1F; border:1px solid #E3D3A0; border-radius:8px;
  padding:.7rem .9rem; font-size:.82rem; margin-bottom:1rem;
}
.envio-warn a{color:var(--accent-2); font-weight:600;}
.envio-dropzone{
  border:2px dashed var(--line-strong); border-radius:12px; padding:2rem 1rem; text-align:center;
  margin-bottom:1.2rem; transition:background .12s, border-color .12s;
}
.envio-dropzone.dragover{background:var(--gold-bg); border-color:var(--accent);}
.envio-dropzone-inner{font-size:.9rem; color:var(--muted);}
.envio-list{display:flex; flex-direction:column; gap:.6rem; margin-bottom:1rem;}
.envio-row{
  display:flex; gap:.6rem; align-items:flex-start; border:1px solid var(--line); border-radius:10px;
  padding:.7rem .8rem; background:#FCFCFA;
}
.envio-row-check{padding-top:.2rem;}
.envio-row-check input{width:15px; height:15px; cursor:pointer;}
.envio-row-main{flex:1; min-width:0;}
.envio-row-name{font-size:.83rem; font-weight:600; margin-bottom:.4rem; word-break:break-word;}
.envio-row-selects{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.4rem;}
.envio-row-selects select{
  padding:.35rem .5rem; border:1px solid var(--line-strong); border-radius:6px; font-size:.78rem;
  font-family:'Public Sans',sans-serif; max-width:220px;
}
.envio-meta-input{
  padding:.35rem .5rem; border:1px solid var(--line-strong); border-radius:6px; font-size:.78rem;
  font-family:'Public Sans',sans-serif; max-width:140px;
}
.envio-badge{
  display:inline-block; font-size:.72rem; font-weight:600; padding:.15rem .55rem; border-radius:20px;
  margin-bottom:.3rem;
}
.envio-badge-processing{background:#EEF0E9; color:var(--muted);}
.envio-badge-warn{background:var(--gold-bg); color:#7A5F1F;}
.envio-badge-error{background:var(--bad-bg); color:var(--bad);}
.envio-badge-sent{background:var(--good-bg); color:var(--good);}
.envio-preview{
  font-size:.76rem; color:var(--muted); background:#F5F4EF; border-radius:6px; padding:.5rem .6rem;
  margin-top:.3rem; line-height:1.5;
}
.envio-remove-btn{flex-shrink:0; font-size:1.1rem;}
.envio-footer{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem;}
.envio-footer-info{font-size:.8rem; color:var(--muted);}

.modal-wide{max-width:760px;}
.imp-summary{font-size:.84rem; color:var(--muted); margin-bottom:.9rem; line-height:1.5;}
.imp-summary strong{color:var(--ink);}
.imp-list{display:flex; flex-direction:column; gap:.6rem; margin-bottom:1rem; max-height:52vh; overflow-y:auto; padding-right:.2rem;}
.imp-row{
  display:flex; gap:.6rem; align-items:flex-start; border:1px solid var(--line); border-radius:10px;
  padding:.7rem .8rem; background:#FCFCFA;
}
.imp-row.is-dup{background:var(--gold-bg); border-color:#E3D3A0;}
.imp-row-check{padding-top:.2rem;}
.imp-row-check input{width:15px; height:15px; cursor:pointer;}
.imp-row-main{flex:1; min-width:0;}
.imp-row-name{font-size:.85rem; font-weight:700; margin-bottom:.15rem; word-break:break-word;}
.imp-row-meta{font-size:.72rem; color:var(--muted); line-height:1.5; margin-bottom:.45rem;}
.imp-row-meta .mono{font-family:'JetBrains Mono',monospace;}
.imp-row-selects{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.35rem;}
.imp-row-selects select{
  padding:.35rem .5rem; border:1px solid var(--line-strong); border-radius:6px; font-size:.78rem;
  font-family:'Public Sans',sans-serif;
}
.imp-badge{
  display:inline-block; font-size:.7rem; font-weight:700; padding:.15rem .55rem; border-radius:20px;
  margin-bottom:.35rem;
}
.imp-badge-dup{background:#E3D3A0; color:#7A5F1F;}
.imp-badge-new{background:var(--good-bg); color:var(--good);}
.imp-dropzone{
  border:2px dashed var(--line-strong); border-radius:12px; padding:1.8rem 1rem; text-align:center;
  margin-bottom:.2rem;
}
.imp-dropzone-inner{font-size:.86rem; color:var(--muted); line-height:1.6;}

.doctype-list{display:flex; flex-direction:column; gap:.6rem; margin-bottom:.8rem;}
.doctype-card{border:1px solid var(--line-strong); border-radius:10px; padding:.8rem 1rem; background:#FCFCFA;}
.doctype-card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:.35rem;}
.doctype-card-name{font-family:'Fraunces',serif; font-weight:600; font-size:.95rem;}
.doctype-card-kw{font-size:.78rem; color:var(--muted); margin-bottom:.2rem;}
.doctype-card-subject{font-size:.78rem; color:var(--ink); margin-top:.3rem;}

.demanda-toolbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; gap:.7rem; flex-wrap:wrap;}
.demanda-filters{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem;}
.demanda-filter-chip{
  background:#FFFFFF; border:1px solid var(--line-strong); color:var(--muted);
  padding:.35rem .75rem; border-radius:20px; font-size:.78rem; font-weight:600; cursor:pointer;
}
.demanda-filter-chip:hover{background:#F2F0E6;}
.demanda-filter-chip.active{background:var(--ink); color:#F2F0E6; border-color:var(--ink);}

.obrig-filters{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:1rem;}
.obrig-mode-toggle{display:flex; border:1px solid var(--line-strong); border-radius:20px; overflow:hidden;}
.obrig-mode-btn{
  background:#fff; border:none; padding:.4rem 1rem; font-size:.78rem; font-weight:600; color:var(--muted);
  cursor:pointer; font-family:'Public Sans',sans-serif;
}
.obrig-mode-btn.active{background:var(--ink); color:#F2F0E6;}
.obrig-filters select{

function storageGet(key){

}

function migrateState(){
  let changed = false;
  state.monthly = state.monthly || {};
  state.annual = state.annual || {};
  state.obligations = state.obligations || [];
  state.docTypes = state.docTypes || [];
  state.demandas = state.demandas || [];
  state.users = state.users || [];
  state.deletedDefaultObligationIds = state.deletedDefaultObligationIds || [];
  state.deletedDefaultDocTypeIds = state.deletedDefaultDocTypeIds || [];
  // Migração: cada obrigação por empresa/período era um simples true/false (feito ou não).
  // Agora vira um registro completo: status (pendente/andamento/concluida), responsável e detalhes.
  function migrateObligationBucket(periodStore){
    Object.keys(periodStore||{}).forEach(pk=>{
      const companyBucket = periodStore[pk];
      Object.keys(companyBucket||{}).forEach(companyId=>{
        const itemsBucket = companyBucket[companyId];
        Object.keys(itemsBucket||{}).forEach(itemId=>{
          const val = itemsBucket[itemId];
          if(typeof val === 'boolean'){
            itemsBucket[itemId] = {status: val ? 'concluida' : 'pendente', responsavelId: null, detalhes: ''};
            changed = true;
          } else if(val && typeof val === 'object' && !val.status){
            val.status = 'pendente';
            if(val.responsavelId===undefined) val.responsavelId = null;
            if(val.detalhes===undefined) val.detalhes = '';
            changed = true;
          }
        });
      });
    });
  }
  migrateObligationBucket(state.monthly);
  migrateObligationBucket(state.annual);
  if(!state.reminderSettings){
    state.reminderSettings = {
      diasAntes: 3,
      whatsappTemplate: 'Olá! Passando para lembrar que a obrigação {obrigacao} de {empresa} vence em {vencimento}. Qualquer dúvida, estamos à disposição.',
      emailSubjectTemplate: 'Lembrete: {obrigacao} vence em {vencimento}',
      emailBodyTemplate: 'Olá,\n\nPassando para lembrar que a obrigação {obrigacao} referente a {empresa} vence em {vencimento}.\n\nQualquer dúvida, estamos à disposição.\n\nAtenciosamente,\nEquipe Contábil',
    };
    changed = true;
  }
  DEFAULT_OBLIGATIONS.forEach(d=>{
    if(state.deletedDefaultObligationIds.includes(d.id)) return; // usuário excluiu de propósito, não recriar
    if(!state.obligations.find(o=>o.id===d.id)){ state.obligations.push({...d}); changed = true; }
  });
  if(state.docTypes.length===0 && !state.docTypesInitialized){
    DEFAULT_DOC_TYPES.forEach(d=>state.docTypes.push({...d}));
    state.docTypesInitialized = true;
    changed = true;
  } else {
    DEFAULT_DOC_TYPES.forEach(d=>{
      if(state.deletedDefaultDocTypeIds.includes(d.id)) return; // usuário excluiu de propósito, não recriar
      if(!state.docTypes.find(dt=>dt.id===d.id)){ state.docTypes.push({...d}); changed = true; }
    });
  }
  // Correção pontual: a primeira versão do tipo "GFD - Guia do FGTS Digital" não excluía as guias
  // de Empréstimo Consignado, então quem já tinha configurado esse tipo antes de existir o tipo
  // separado de Consignado precisa dessa exclusão adicionada manualmente uma vez.
  if(!state.fgtsExcludeFixed){
    const fgtsType = state.docTypes.find(d=>d.id==='doctype__fgts');
    if(fgtsType && !(fgtsType.excludeKeywords||[]).includes('EMPRESTIMO TRABALHADOR')){
      fgtsType.excludeKeywords = [...(fgtsType.excludeKeywords||[]), 'EMPRESTIMO TRABALHADOR'];
    }
    state.fgtsExcludeFixed = true;
    changed = true;
  }
  // Correção pontual: a primeira versão do tipo "DARF - INSS/IRRF sobre Folha" tinha uma palavra-chave
  // frágil demais ("PA:") e ficou duplicada no catálogo padrão — quem já tinha sincronizado essa versão
  // precisa da correção aplicada uma vez, trocando para a palavra-chave certa ("SENDA").
  if(!state.darfFolhaFixed){
    const darfFolha = state.docTypes.find(d=>d.id==='doctype__darf_folha');
    if(darfFolha && !(darfFolha.keywords||[]).includes('SENDA')){
      darfFolha.keywords = ['Receitas Federais', 'SENDA'];
      darfFolha.excludeKeywords = [];
      darfFolha.name = 'DARF - INSS/IRRF sobre Folha (eSocial)';
    }
    state.darfFolhaFixed = true;
    changed = true;
  }
  state.companies.forEach(c=>{
    if(!c.obligations){ c.obligations = computeDefaultObligations(c); changed = true; }
    if(c.anual===undefined){ c.anual = true; changed = true; }
    if(c.parcelamentos===undefined){ c.parcelamentos = false; changed = true; }
  });
  if(!state.meiMigrated){
    state.companies.forEach(c=>{
      if(c.trib==='SIMEI' && Array.isArray(c.obligations)){
        if(c.obligations.some(id=>id.startsWith('simples__'))){
          c.obligations = c.obligations.filter(id=>!id.startsWith('simples__'));
          if(!c.obligations.includes('mei__das')) c.obligations.push('mei__das');
          if(!c.obligations.includes('mei__nfe')) c.obligations.push('mei__nfe');
          changed = true;
        }
        if(c.obligations.includes('anual__defis')){
          c.obligations = c.obligations.filter(id=>id!=='anual__defis');
          if(!c.obligations.includes('anual__dasn')) c.obligations.push('anual__dasn');
          changed = true;
        }
      }
    });
    state.meiMigrated = true;
    changed = true;
  }
  return changed;
}

function firestoreDocRef(){
  return db.collection('appData').doc('main');
}

async function loadState(){
  if(firestoreUnsub){ firestoreUnsub(); firestoreUnsub = null; }
  let firstLoadResolved = false;
  return new Promise((resolve)=>{
    // Limite de segurança: se o Firestore não responder (nem sucesso, nem erro) dentro desse tempo
    // — ex: conexão travada silenciosamente por rede/firewall — desistimos e avisamos, em vez de
    // deixar a tela girando pra sempre sem explicação.
    const timeoutId = setTimeout(()=>{
      if(!firstLoadResolved){
        firstLoadResolved = true;
        console.error('Tempo esgotado esperando resposta do Firestore (15s sem sucesso nem erro).');
        resolve(false);
      }
    }, 15000);
    firestoreUnsub = firestoreDocRef().onSnapshot(async (snap)=>{
      try{
        // Importante: nunca criar/gravar dados a partir de uma leitura que ainda não foi confirmada
        // pelo servidor (snap.metadata.fromCache) — isso evita que um dispositivo com cache local
        // desatualizado (ex: computador que não abre o app há um tempo) grave por cima dados mais
        // recentes que outra pessoa da equipe já salvou, antes de sincronizar de verdade.
        const fromCache = snap.metadata && snap.metadata.fromCache;
        if(!snap.exists){
          if(fromCache){
            // Ainda não sabemos se o documento existe de verdade — só o servidor pode confirmar isso.
            // Atualiza a tela com o que tiver (evita tela em branco) mas não cria nada ainda.
            if(state) renderAll();
          } else {
            const cachedRaw = storageGet(STORAGE_KEY);
            let seeded = null;
            if(cachedRaw){
              try{ seeded = JSON.parse(cachedRaw); }catch(e){ seeded = null; }
            }
            if(seeded && Array.isArray(seeded.companies) && seeded.companies.length){
              state = seeded;
              migrateState();
            } else {
              state = {
                companies: SEED_COMPANIES.map(c=>({...c})),
                monthly:{},
                annual:{},
                obligations: DEFAULT_OBLIGATIONS.map(o=>({...o})),
                docTypes: DEFAULT_DOC_TYPES.map(d=>({...d})),
                docTypesInitialized: true,
                demandas: [],
                users: [],
              };
              state.companies.forEach(c=>{ c.obligations = computeDefaultObligations(c); c.anual = true; c.parcelamentos = false; });
              migrateState();
            }
            await firestoreDocRef().set(state);
            storageSet(STORAGE_KEY, JSON.stringify(state));
          }
        } else {
          state = snap.data() || {};
          window.__debugState = state; // temporário: pra diagnosticar direto no console do navegador
          if(!fromCache){
            const changed = migrateState();
            if(changed) persist();
          }
          storageSet(STORAGE_KEY, JSON.stringify(state)); // cache local de apoio (não autoritativo)
        }
      }catch(e){
        console.error('Erro carregando dados do Firestore', e);
      }
      if(!firstLoadResolved){
        // Só libera a tela quando já temos um `state` de verdade — evita renderizar antes da hora
        // quando a primeira resposta é só "ainda não sei se existe" (cache local vazio, esperando
        // confirmação do servidor). Se ainda não tiver `state`, esperamos a próxima notificação.
        if(state){
          firstLoadResolved = true;
          clearTimeout(timeoutId);
          resolve(true);
        }
      } else {
        if(state) renderAll(); // atualização em tempo real (própria ou de outro usuário da equipe); ignora se a resposta chegou tarde demais (depois do tempo esgotado) e ainda não há dados
      }
    }, (err)=>{
      console.error('Erro de conexão com o Firestore', err);
      if(!firstLoadResolved){ firstLoadResolved = true; clearTimeout(timeoutId); resolve(false); }
    });
  });
}

function persist(){
  clearTimeout(saveTimer);
  return new Promise(resolve=>{
    saveTimer = setTimeout(async ()=>{
      state.lastEditedBy = currentUser ? currentUser.email : null;
      state.lastEditedAt = new Date().toISOString();
      try{
        await firestoreDocRef().set(state);
      }catch(e){
        console.error('Erro ao salvar no Firestore', e);
      }
      resolve();
    }, 250);
  });
}

/* ---------- Conexão Google para envio de e-mail (Gmail) ---------- */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
const DRIVE_CLIENT_ID_KEY = 'agenda-drive-client-id';
const DRIVE_CONNECTED_KEY = 'agenda-drive-connected';

let driveTokenClient = null;
let driveAccessToken = null;
let driveStatus = 'disconnected'; // disconnected | connecting | connected | error
let driveLastSync = null;
let driveErrorMsg = '';

function getDriveClientId(){ return storageGet(DRIVE_CLIENT_ID_KEY) || ''; }
function setDriveClientId(id){ storageSet(DRIVE_CLIENT_ID_KEY, id); }

function loadGsiScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    let attempts = 0;
    const check = setInterval(()=>{
      attempts++;
      if(window.google && window.google.accounts && window.google.accounts.oauth2){
        clearInterval(check); resolve();
      } else if(attempts > 40){
        clearInterval(check); reject(new Error('Não foi possível carregar o serviço de login do Google. Verifique sua conexão com a internet.'));
      }
    }, 250);
  });
}

async function initDriveTokenClient(){
  const clientId = getDriveClientId();
  if(!clientId) throw new Error('Cole o Client ID do Google antes de conectar.');
  await loadGsiScript();
  if(!driveTokenClient || driveTokenClient.__clientId !== clientId){
    driveTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: ()=>{},
    });
    driveTokenClient.__clientId = clientId;
  }
  return driveTokenClient;
}

function requestDriveToken(promptMode){
  return new Promise((resolve, reject)=>{
    initDriveTokenClient().then(client=>{
      client.callback = (resp)=>{
        if(resp && resp.access_token){
          driveAccessToken = resp.access_token;
          resolve(resp.access_token);
        } else {
          reject(new Error((resp && resp.error) || 'Não foi possível obter permissão de acesso ao Drive.'));
        }
      };
      client.error_callback = (err)=>{ reject(new Error((err && err.type) || 'Login cancelado ou não autorizado.')); };
      client.requestAccessToken({ prompt: promptMode });
    }).catch(reject);
  });
}

async function driveFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + driveAccessToken });
  let res = await fetch(url, options);
  if(res.status===401){
    await requestDriveToken('');
    options.headers.Authorization = 'Bearer ' + driveAccessToken;
    res = await fetch(url, options);
  }
  return res;
}

async function connectDrive(){
  driveStatus = 'connecting';
  driveErrorMsg = '';
  updateDriveStatusUI();
  try{
    await requestDriveToken('consent');
    driveStatus = 'connected';
    driveLastSync = new Date();
    storageSet(DRIVE_CONNECTED_KEY, '1');
  }catch(e){
    console.error('Erro ao conectar ao Gmail', e);
    driveStatus = 'error';
    driveErrorMsg = e.message || 'Erro desconhecido.';
  }
  updateDriveStatusUI();
}

function disconnectDrive(){
  driveAccessToken = null;
  driveStatus = 'disconnected';
  driveErrorMsg = '';
  storageSet(DRIVE_CONNECTED_KEY, '');
  updateDriveStatusUI();
}

async function tryAutoReconnectDrive(){
  if(storageGet(DRIVE_CONNECTED_KEY)!=='1') return;
  if(!getDriveClientId()) return;
  driveStatus = 'connecting';
  updateDriveStatusUI();
  try{
    await requestDriveToken('');
    driveStatus = 'connected';
    driveLastSync = new Date();
  }catch(e){
    console.warn('Reconexão automática ao Gmail não foi possível (normal se a sessão expirou):', e.message);
    driveStatus = 'disconnected';
  }
  updateDriveStatusUI();
}

/* ---------- Carregamento de bibliotecas externas com múltiplas fontes (resiliente a bloqueio de rede/firewall) ---------- */
function loadScriptWithFallback(urls, checkFn, timeoutMs){
  return new Promise((resolve, reject)=>{
    let i = 0;
    function tryNext(){
      if(checkFn()){ resolve(); return; }
      if(i >= urls.length){ reject(new Error('Não foi possível carregar um recurso necessário em nenhuma das fontes disponíveis. Verifique sua conexão com a internet.')); return; }
      const url = urls[i++];
      const s = document.createElement('script');
      s.src = url;
      let done = false;
      const t = setTimeout(()=>{ if(done) return; done=true; s.remove(); tryNext(); }, timeoutMs || 6000);
      s.onload = ()=>{ if(done) return; done=true; clearTimeout(t); if(checkFn()) resolve(); else tryNext(); };
      s.onerror = ()=>{ if(done) return; done=true; clearTimeout(t); s.remove(); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

let xlsxLoadPromise = null;
function ensureXlsx(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLoadPromise){
    xlsxLoadPromise = loadScriptWithFallback([
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    ], ()=>!!window.XLSX, 6000).catch(e=>{ xlsxLoadPromise=null; throw e; });
  }
  return xlsxLoadPromise;
}

/* ---------- Document automation: PDF reading, recognition, Gmail sending ---------- */
let pdfJsLoadPromise = null;
const PDFJS_SOURCES = [
  { lib: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs', worker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs' },
  { lib: 'https://unpkg.com/pdfjs-dist@4.0.379/build/pdf.min.mjs', worker: 'https://unpkg.com/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs' },
];
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(!pdfJsLoadPromise){
    pdfJsLoadPromise = (async ()=>{
      for(const src of PDFJS_SOURCES){
        try{
          const mod = await import(/* @vite-ignore */ src.lib);
          window.pdfjsLib = mod;
          mod.GlobalWorkerOptions.workerSrc = src.worker;
          return;
        }catch(e){
          console.warn('Falha ao carregar pdf.js de', src.lib, e);
        }
      }
      pdfJsLoadPromise = null;
      throw new Error('Não foi possível carregar o leitor de PDF em nenhuma das fontes disponíveis. Verifique sua conexão com a internet.');
    })();
  }
  return pdfJsLoadPromise;
}

async function extractPdfText(file){
  await ensurePdfJs();
  const buffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: buffer}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}

function normalizeDigits(str){ return (str||'').replace(/\D/g,''); }

function findCompanyInText(text){
  const candidates = new Set();
  (text.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g) || []).forEach(m=>candidates.add(normalizeDigits(m)));
  (text.match(/\d{3}\.?\d{3}\.?\d{3}-?\d{2}/g) || []).forEach(m=>candidates.add(normalizeDigits(m)));
  for(const c of candidates){
    const found = state.companies.find(co=> normalizeDigits(co.cnpj)===c && co.ativa!==false);
    if(found) return found;
  }
  // Fallback: alguns documentos (ex: Guia do FGTS Digital) mostram só a raiz do CNPJ,
  // os 8 primeiros dígitos, sem filial nem dígito verificador (ex: "58.725.453").
  const rootCandidates = new Set();
  (text.match(/\b\d{2}\.\d{3}\.\d{3}\b/g) || []).forEach(m=>rootCandidates.add(normalizeDigits(m)));
  for(const root of rootCandidates){
    const found = state.companies.find(co=> normalizeDigits(co.cnpj).slice(0,8)===root && co.ativa!==false);
    if(found) return found;
  }
  // Fallback for documents without CNPJ (e.g. municipal DAM/ISSQN from prefeituras):
  // try matching by Inscrição Municipal number.
  const imCandidates = new Set();
  (text.match(/\b\d{5,10}\b/g) || []).forEach(m=>imCandidates.add(m));
  for(const c of imCandidates){
    const found = state.companies.find(co=> co.im && normalizeDigits(co.im)===c && co.ativa!==false);
    if(found) return found;
  }
  // Last resort: match by the company's registered name appearing verbatim in the text.
  const upperText = text.toUpperCase();
  const byName = state.companies.find(co=> co.ativa!==false && co.nome && co.nome.trim().length>4 && upperText.includes(co.nome.toUpperCase()));
  if(byName) return byName;
  return null;
}

function findDocTypeInText(text){
  const lower = text.toLowerCase();
  for(const dt of state.docTypes){
    const kws = dt.keywords || [];
    if(kws.length===0) continue;
    const allPresent = kws.every(k=> lower.includes(String(k).toLowerCase()));
    if(!allPresent) continue;
    const excl = dt.excludeKeywords || [];
    const anyExcluded = excl.some(k=> lower.includes(String(k).toLowerCase()));
    if(anyExcluded) continue;
    return dt;
  }
  return null;
}

function extractCompetenciaVencimento(text){
  let competencia = '';
  let vencimento = '';

  const MESES = 'janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro';
  const tokenRegex = new RegExp(`(\\d{2}\\/\\d{2}\\/\\d{4})|((?:${MESES})\\/\\d{4})`, 'gi');

  // Finds the date value closest to a label, searching BOTH before and after every occurrence
  // of the label — some PDF generators emit "label then value", others emit "value then label",
  // and this varies even between documents from the same source, so distance-based matching in
  // either direction is the only reliable general strategy.
  function nearestDateNearLabel(labelRegex, window){
    const flags = labelRegex.flags.includes('g') ? labelRegex.flags : labelRegex.flags + 'g';
    const re = new RegExp(labelRegex.source, flags);
    let m, best = null, bestDist = Infinity;
    while((m = re.exec(text))){
      const start = Math.max(0, m.index - window);
      const end = Math.min(text.length, m.index + m[0].length + window);
      const segment = text.slice(start, end);
      const labelStart = m.index - start, labelEnd = labelStart + m[0].length;
      const dateRe = /\d{2}\/\d{2}\/\d{4}/g;
      let dm;
      while((dm = dateRe.exec(segment))){
        let dist;
        if(dm.index >= labelEnd) dist = dm.index - labelEnd;
        else if(dm.index + dm[0].length <= labelStart) dist = labelStart - (dm.index + dm[0].length);
        else dist = 0;
        if(dist < bestDist){ bestDist = dist; best = dm[0]; }
      }
    }
    return best;
  }

  // Mesma lógica de "mais próximo do rótulo", mas para valores no formato MM/AAAA (sem dia) —
  // usado por guias que trazem a competência como cabeçalho de tabela (ex: GFD - Guia do FGTS Digital).
  function nearestMonthYearNearLabel(labelRegex, window){
    const flags = labelRegex.flags.includes('g') ? labelRegex.flags : labelRegex.flags + 'g';
    const re = new RegExp(labelRegex.source, flags);
    let m, best = null, bestDist = Infinity;
    while((m = re.exec(text))){
      const start = Math.max(0, m.index - window);
      const end = Math.min(text.length, m.index + m[0].length + window);
      const segment = text.slice(start, end);
      const labelStart = m.index - start, labelEnd = labelStart + m[0].length;
      // O lookbehind evita confundir "MM/AAAA" com o final de uma data completa "DD/MM/AAAA" que
      // esteja por perto (ex: não interpretar o "08/2026" de "20/08/2026" como competência).
      const dateRe = /(?<!\d{2}\/)\b\d{2}\/\d{4}\b/g;
      let dm;
      while((dm = dateRe.exec(segment))){
        let dist;
        if(dm.index >= labelEnd) dist = dm.index - labelEnd;
        else if(dm.index + dm[0].length <= labelStart) dist = labelStart - (dm.index + dm[0].length);
        else dist = 0;
        if(dist < bestDist){ bestDist = dist; best = dm[0]; }
      }
    }
    return best;
  }

  // Alguns DARFs (ex: guias geradas pelo sistema SENDA/eSocial para INSS/IRRF sobre folha) repetem,
  // junto de cada item da guia, o padrão colado "PA:MM/AAAA ... Vencimento:DD/MM/AAAA" — isso é mais
  // confiável que o cabeçalho "Período de Apuração" nesses documentos, porque o gerador desse PDF às
  // vezes emite o rótulo do cabeçalho bem longe do seu valor real (o texto extraído do PDF não segue
  // a ordem visual de leitura), enquanto esse padrão por item mantém rótulo e valor sempre colados.
  const paInlineMatch = text.match(/PA:\s*(\d{2}\/\d{4})[^0-9]{0,30}?Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/i);
  if(paInlineMatch){
    competencia = paInlineMatch[1];
    vencimento = paInlineMatch[2];
  }

  // "Período de Apuração" is the authoritative field whenever present (DAS, DARF, PGDAS-D).
  // We scan a generous window after the label and read período + vencimento together, in the
  // order their values actually appear — this stays correct whether the real PDF text extraction
  // keeps "label value label value" order or bunches all labels first, then all values (both are
  // common depending on the PDF generator), since either way the dates keep their column order.
  const paMatch = text.match(/Per[íi]odo de Apura[çc][ãa]o/i);
  if(paMatch && !paInlineMatch){
    const win = text.slice(paMatch.index + paMatch[0].length, paMatch.index + paMatch[0].length + 200);
    const rangeMatch = win.match(/(\d{2}\/\d{2}\/\d{4})\s*a\s*(\d{2}\/\d{2}\/\d{4})/i);
    if(rangeMatch && rangeMatch.index < 5){
      // Range sits right after the label (e.g. PGDAS-D declaration) — no separate vencimento here.
      competencia = rangeMatch[1] + ' a ' + rangeMatch[2];
    } else {
      const tokens = [...win.matchAll(tokenRegex)].map(m=>m[0]);
      if(tokens.length>=1) competencia = tokens[0];
      if(tokens.length>=2){
        const nextDate = tokens.slice(1).find(t=>/^\d{2}\/\d{2}\/\d{4}$/.test(t));
        if(nextDate) vencimento = nextDate;
      }
    }
  }

  // Guias tipo "GFD - Guia do FGTS Digital" (Caixa) usam esta frase específica em vez de "Vencimento".
  if(!vencimento){
    const pagarMatch = text.match(/Pagar\s+este\s+documento\s+at[ée][^0-9]{0,100}?(\d{2}\/\d{2}\/\d{4})/i);
    if(pagarMatch) vencimento = pagarMatch[1];
  }
  if(!vencimento){
    const vencMatch = text.match(/Venc(?:imento)?[^0-9]{0,40}?(\d{2}\/\d{2}\/\d{4})/i);
    if(vencMatch) vencimento = vencMatch[1];
  }
  if(!vencimento){
    vencimento = nearestDateNearLabel(/Venc(?:imento)?/i, 80) || '';
  }

  // Fallback: DARF-style inline "PA 01/2026" or "PA:2º Trimestre/2026" reference near the tax code
  if(!competencia){
    let m = text.match(/\bPA[:\s]*(\d+[ºo]?\s*Trimestre\/\d{4}|\d{1,2}\/\d{4})/i);
    if(m) competencia = m[1].trim();
  }
  // Fallback: "Referência" field (e.g. Alvará/TVF municipal fee: "Cota Única" or "N/N" parcela)
  if(!competencia){
    const idx = text.search(/Refer[êe]ncia/i);
    if(idx !== -1){
      const win = text.slice(Math.max(0, idx-150), idx+60);
      const refMatch = win.match(/(Cota\s*[ÚU]nica|\b\d\/\d{1,2}\b(?!\d))/i);
      if(refMatch) competencia = refMatch[1];
    }
  }
  // Fallback: municipal DAM style "EXERC. MÊS" — only fires when both labels are actually present
  // near each other (avoids misreading stray 1-12 digits from unrelated money amounts elsewhere
  // in the document). Real PDF extraction often bunches "EXERC. MÊS PROCESSAMENTO" labels
  // together, with the actual year/month values appearing only afterward, so once confirmed we're
  // in the right field we pick whichever nearby number is closest to the "MÊS" label itself.
  if(!competencia){
    const exercIdx = text.search(/EXERC/i);
    const mesIdx = text.search(/\bM[ÊE]S\b/i);
    if(exercIdx !== -1 && mesIdx !== -1 && Math.abs(mesIdx - exercIdx) < 60){
      const winStart = Math.min(exercIdx, mesIdx);
      const win = text.slice(winStart, winStart + 150);
      const yearMatch = win.match(/\b(20\d{2})\b/);
      if(yearMatch){
        const mesLabelPos = mesIdx - winStart;
        const numRe = /\b(0?[1-9]|1[0-2])\b/g;
        let nm, best = null, bestDist = Infinity;
        while((nm = numRe.exec(win))){
          if(nm.index === yearMatch.index) continue;
          const dist = Math.abs(nm.index - mesLabelPos);
          if(dist < bestDist){ bestDist = dist; best = nm[1]; }
        }
        if(best) competencia = String(best).padStart(2,'0') + '/' + yearMatch[1];
      }
    }
  }
  // Fallback: generic "Período: DD/MM/YYYY a DD/MM/YYYY" (e.g. Retenções a Recolher report)
  if(!competencia){
    const idx = text.search(/Per[íi]odo/i);
    if(idx !== -1){
      const windowText = text.slice(idx, idx+80);
      const dates = windowText.match(/\d{2}\/\d{2}\/\d{4}/g);
      if(dates && dates.length>=2) competencia = dates[0] + ' a ' + dates[1];
      else if(dates && dates.length===1) competencia = dates[0];
    }
  }
  // Fallback: guias com "Competência" como cabeçalho de tabela e valor em MM/AAAA
  // (ex: GFD - Guia do FGTS Digital).
  if(!competencia){
    competencia = nearestMonthYearNearLabel(/Compet[êe]ncia/i, 250) || '';
  }
  // If we still have no vencimento but do have a competência, fall back to the closest
  // date overall found anywhere near "Referência" (covers documents like the Alvará/TVF where
  // values are emitted before their labels).
  if(!vencimento){
    vencimento = nearestDateNearLabel(/Refer[êe]ncia/i, 60) || '';
  }
  return { competencia, vencimento };
}

function fillTemplate(tpl, vars){
  return (tpl||'').replace(/\{(\w+)\}/g, (m,k)=> (vars[k]!==undefined ? vars[k] : m));
}

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}

function base64UrlEncodeUnicode(str){
  const utf8 = unescape(encodeURIComponent(str));
  const b64 = btoa(utf8);
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function buildMimeMessage({to, subject, body, attachmentName, attachmentBase64}){
  const boundary = 'agendaobrig_' + Date.now();
  const encodedSubject = '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(subject))) + '?=';
  const parts = [
    `To: ${to}`,
    `Subject: ${encodedSubject}`,
    'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${boundary}"`,
    '',
    `--${boundary}`,
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: 8bit',
    '',
    body,
    '',
    `--${boundary}`,
    `Content-Type: application/pdf; name="${attachmentName}"`,
    'Content-Transfer-Encoding: base64',
    `Content-Disposition: attachment; filename="${attachmentName}"`,
    '',
    attachmentBase64,
    '',
    `--${boundary}--`,
  ];
  return parts.join('\r\n');
}

async function sendGmailWithAttachment({to, subject, body, attachmentName, attachmentBase64}){
  const raw = buildMimeMessage({to, subject, body, attachmentName, attachmentBase64});
  const encoded = base64UrlEncodeUnicode(raw);
  const res = await driveFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ raw: encoded }),
  });
  if(!res.ok){
    let msg = 'Erro ao enviar e-mail.';
    try{ const errData = await res.json(); if(errData.error && errData.error.message) msg = errData.error.message; }catch(e){}
    throw new Error(msg);
  }
  return true;
}

function buildPlainMimeMessage({to, subject, body}){
  const encodedSubject = '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(subject))) + '?=';
  return [
    `To: ${to}`,
    `Subject: ${encodedSubject}`,
    'MIME-Version: 1.0',
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: 8bit',
    '',
    body,
  ].join('\r\n');
}

async function sendGmailPlain({to, subject, body}){
  const raw = buildPlainMimeMessage({to, subject, body});
  const encoded = base64UrlEncodeUnicode(raw);
  const res = await driveFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ raw: encoded }),
  });
  if(!res.ok){
    let msg = 'Erro ao enviar e-mail.';
    try{ const errData = await res.json(); if(errData.error && errData.error.message) msg = errData.error.message; }catch(e){}
    throw new Error(msg);
  }
  return true;
}

async function processDocumentFile(file){
  // Note: kept as a reusable helper; the Envio tab currently inlines this logic in handleEnvioFiles.
  const item = { file, name: file.name, status:'processing', company:null, docType:null, text:'' };
  try{
    item.text = await extractPdfText(file);
    item.company = findCompanyInText(item.text);
    item.docType = findDocTypeInText(item.text);
    item.status = 'ready';
  }catch(e){
    item.status = 'error';
    item.error = e.message || 'Erro ao ler o PDF.';
  }
  return item;
}
function updateDriveStatusUI(){
  const map = {
    disconnected: {text:'✉️ Gmail não conectado', cls:'drive-off'},
    connecting: {text:'✉️ Conectando…', cls:'drive-connecting'},
    connected: {text:'✉️ Gmail conectado'+(driveLastSync? ' · '+driveLastSync.toLocaleTimeString('pt-BR').slice(0,5) : ''), cls:'drive-on'},

  };
  const info = map[driveStatus] || map.disconnected;
  const el = document.getElementById('driveStatusBadge');
  if(el){
    el.textContent = info.text.replace('✉️ ','');
    el.className = 'drive-status-badge ' + info.cls;
  }
  const headerBadge = document.getElementById('headerDriveBadge');
  if(headerBadge){
    headerBadge.textContent = info.text;
    headerBadge.className = 'drive-status-badge ' + info.cls;

function monthNumFromKey(key){ return parseInt(key.split('-')[1],10); }

function obligationCategory(id){
  const o = state.obligations.find(x=>x.id===id);
  return o ? o.category : null;
}
function catalogByCategory(category){
  return state.obligations.filter(o=>o.category===category);
}
function moveObligationInCategory(id, direction){
  const cat = obligationCategory(id);
  if(!cat) return false;
  const indices = [];
  state.obligations.forEach((o,i)=>{ if(o.category===cat) indices.push(i); });
  const posInList = indices.findIndex(i=>state.obligations[i].id===id);
  const targetPos = posInList + direction;
  if(posInList===-1 || targetPos<0 || targetPos>=indices.length) return false;
  const idxA = indices[posInList];
  const idxB = indices[targetPos];
  const tmp = state.obligations[idxA];
  state.obligations[idxA] = state.obligations[idxB];
  state.obligations[idxB] = tmp;
  persist();
  return true;
}
function companyItemsForCategory(company, category, periodKey){
  const assignedIds = company.obligations || [];
  return catalogByCategory(category)
    .filter(o=>assignedIds.includes(o.id))
    .filter(o=>{
      if(o.seasonalMonth && periodKey && String(periodKey).includes('-')){
        return monthNumFromKey(periodKey) === o.seasonalMonth;
      }
      return true;
    })
    .map(o=>({id:o.id, label:o.label}));
}
function computeDefaultObligations(c){
  const ids = [];

    ids.push('mei__das', 'mei__nfe');

    ids.push('simples__pgdas');
    if(c.ativ.includes('COMÉRCIO')) ids.push('simples__sefaz');
    if(c.ativ.includes('SERVIÇO')) ids.push('simples__semef');
  } else {
    ids.push('pr__apuracao','pr__dctf');
    if(c.ativ.includes('COMÉRCIO')) ids.push('pr__sefaz');
    if(c.ativ.includes('SERVIÇO')) ids.push('pr__semef');
  }
  if(c.folha){
    ids.push('folha__ativa','folha__ponto','folha__consignado','folha__adto','folha__fechamento','folha__adto13','folha__sal13');
    if(c.ativ.includes('SERVIÇO')) ids.push('folha__semef');
  }
  if(c.suframa){
    ids.push('suframa__insc','suframa__venc','suframa__gru','suframa__pin','suframa__receb');
  }
  if(c.contab){
    ids.push('contabil__caixa','contabil__banco','contabil__extratos','contabil__impfiscal');
  }
  if(c.trib==='PRESUMIDO' || c.trib==='REAL') ids.push('anual__ecd');
  ids.push('anual__efd');
  if(c.trib==='SIMPLES') ids.push('anual__defis');
  if(c.trib==='SIMEI') ids.push('anual__dasn');
  ids.push('anual__dirf');
  if(c.folha) ids.push('anual__rais');
  return ids;
}

function activeCompanies(){
  return state.companies.filter(c=>c.ativa!==false);
}
function periodBucket(period){
  const pk = period==='year' ? selectedYear : selectedMonth;
  const store = period==='year' ? state.annual : state.monthly;
  if(!store[pk]) store[pk] = {};
  return {pk, obj:store[pk]};
}
const OBRIG_STATUS_LABELS = {pendente:'Pendente', andamento:'Em andamento', concluida:'Concluída'};
function getObligationEntry(period, companyId, itemKey){
  const {obj} = periodBucket(period);
  if(!obj[companyId]) obj[companyId] = {};
  if(!obj[companyId][itemKey]){
    obj[companyId][itemKey] = {status:'pendente', responsavelId:null, detalhes:''};
  }
  return obj[companyId][itemKey];
}
function setObligationField(period, companyId, itemKey, field, value){
  const entry = getObligationEntry(period, companyId, itemKey);
  entry[field] = value;
  persist();
}
function isChecked(period, companyId, itemKey){
  const {obj} = periodBucket(period);
  const entry = obj[companyId] && obj[companyId][itemKey];
  return !!(entry && entry.status === 'concluida');
}

function buildWhatsAppLink(phone, message){
  let digits = (phone||'').replace(/\D/g,'');
  if(!digits) return null;
  if(digits.length<=11) digits = '55' + digits; // assume Brasil se não vier com código do país
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

function computeUpcomingReminders(){
  const settings = state.reminderSettings || {diasAntes:3};
  const diasAntes = settings.diasAntes || 3;
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const results = [];
  activeCompanies().forEach(c=>{
    CATEGORY_ORDER.forEach(cat=>{
      if(cat==='anual') return; // obrigações anuais ficam fora do escopo dos lembretes por enquanto
      if(!TAB_DEFS[cat].filter(c)) return;
      const items = companyItemsForCategory(c, cat, todayKey);
      items.forEach(item=>{
        const ob = state.obligations.find(o=>o.id===item.id);
        if(!ob || !ob.dueDay) return;
        const due = new Date(today.getFullYear(), today.getMonth(), ob.dueDay);
        const diffDays = Math.round((due - today) / 86400000);
        if(diffDays > diasAntes) return;
        const bucket = state.monthly[todayKey] && state.monthly[todayKey][c.id] && state.monthly[todayKey][c.id][item.id];
        const done = !!(bucket && bucket.status === 'concluida');
        if(done) return;
        results.push({
          company: c,
          obligationLabel: item.label,
          due,
          diffDays,
          category: cat,
        });
      });
    });
  });
  results.sort((a,b)=> a.diffDays - b.diffDays);
  return results;
}

function reminderStatusLabel(diffDays){
  if(diffDays < 0) return `Venceu há ${Math.abs(diffDays)} dia(s)`;
  if(diffDays === 0) return 'Vence hoje';
  if(diffDays === 1) return 'Vence amanhã';
  return `Vence em ${diffDays} dias`;
}
function toggleItem(period, companyId, itemKey){
  const {obj} = periodBucket(period);
  if(!obj[companyId]) obj[companyId] = {};
  obj[companyId][itemKey] = !obj[companyId][itemKey];
  persist();
}
function companyProgress(tabId, company){
  const def = TAB_DEFS[tabId];
  const period = def.period;
  const pk = period==='year' ? selectedYear : selectedMonth;
  const items = def.items(company, pk);
  if(items.length===0) return {total:0, done:0, items};
  let done = 0;
  items.forEach(it=>{ if(isChecked(period, company.id, it.id)) done++; });
  return {total:items.length, done, items};
}

function matchesSearch(c){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase().trim();
  const qDigits = q.replace(/\D/g,'');
  const nomeMatch = c.nome.toLowerCase().includes(q);
  const cnpjMatch = qDigits.length>0 && c.cnpj.replace(/\D/g,'').includes(qDigits);
  return nomeMatch || cnpjMatch;
}

async function copyTextToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){ /* fall through to legacy fallback below */ }
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

/* ---------- Obrigações (tabela única: vencimento, responsável, status, detalhes) ---------- */
function peekObligationEntry(period, companyId, itemKey){
  const {obj} = periodBucket(period);
  const entry = obj[companyId] && obj[companyId][itemKey];
  return entry || {status:'pendente', responsavelId:null, detalhes:''};
}

function computeObrigacoesRows(){
  const cats = obrigViewMode==='anual' ? ['anual'] : CATEGORY_ORDER.filter(c=>c!=='anual');
  const companies = activeCompanies().filter(matchesSearch);
  const rows = [];
  companies.forEach(c=>{
    cats.forEach(cat=>{
      if(obrigFilterCategoria!=='todas' && obrigFilterCategoria!==cat) return;
      if(!TAB_DEFS[cat].filter(c)) return;
      const period = TAB_DEFS[cat].period;
      const pk = period==='year' ? selectedYear : selectedMonth;
      const items = TAB_DEFS[cat].items(c, pk);
      items.forEach(item=>{
        const entry = peekObligationEntry(period, c.id, item.id);
        if(obrigFilterStatus!=='todos' && entry.status!==obrigFilterStatus) return;
        if(obrigFilterResponsavel==='none' && entry.responsavelId) return;
        if(obrigFilterResponsavel!=='todos' && obrigFilterResponsavel!=='none' && entry.responsavelId!==obrigFilterResponsavel) return;
        const ob = state.obligations.find(o=>o.id===item.id);
        let vencimento = null;
        if(ob && ob.dueDay && period==='month'){
          const [y,m] = selectedMonth.split('-').map(Number);
          vencimento = new Date(y, m-1, ob.dueDay);
        }
        rows.push({company:c, category:cat, period, item, entry, vencimento});
      });
    });
  });
  rows.sort((a,b)=>{
    if(a.vencimento && b.vencimento) return a.vencimento - b.vencimento;
    if(a.vencimento) return -1;
    if(b.vencimento) return 1;
    return a.company.nome.localeCompare(b.company.nome);
  });
  return rows;
}

function obrigRowKey(row){

function wireObrigacoesHandlers(rows){
  const container = document.getElementById('sheetContent');
  container.querySelectorAll('[data-obrig-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      obrigViewMode = btn.dataset.obrigMode;
      obrigFilterCategoria = 'todas';
      renderPeriodControl();
      renderObrigacoes();
    });
  });
  const catSel = document.getElementById('obrigFilterCategoriaSelect');
  if(catSel) catSel.addEventListener('change', ()=>{ obrigFilterCategoria = catSel.value; renderObrigacoes(); });
  const statusSel = document.getElementById('obrigFilterStatusSelect');
  if(statusSel) statusSel.addEventListener('change', ()=>{ obrigFilterStatus = statusSel.value; renderObrigacoes(); });
  const respSel = document.getElementById('obrigFilterResponsavelSelect');
  if(respSel) respSel.addEventListener('change', ()=>{ obrigFilterResponsavel = respSel.value; renderObrigacoes(); });

  function findRow(key){ return rows.find(r=>obrigRowKey(r)===key); }

  container.querySelectorAll('[data-obrig-status]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const row = findRow(sel.dataset.obrigStatus);
      if(!row) return;
      setObligationField(row.period, row.company.id, row.item.id, 'status', sel.value);
      sel.className = 'obrig-status-select status-' + sel.value;
      renderTabs(); // atualiza contador de lembretes / progresso
    });
  });
  container.querySelectorAll('[data-obrig-resp]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const row = findRow(sel.dataset.obrigResp);
      if(!row) return;
      setObligationField(row.period, row.company.id, row.item.id, 'responsavelId', sel.value || null);
    });
  });
  container.querySelectorAll('[data-obrig-detalhes]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const row = findRow(inp.dataset.obrigDetalhes);
      if(!row) return;
      setObligationField(row.period, row.company.id, row.item.id, 'detalhes', inp.value);
    });
  });
}

/* ---------- Custom confirm dialog (native confirm() can be blocked in sandboxed previews) ---------- */
function showConfirm(message, confirmLabel){
  return new Promise((resolve)=>{
    const root = document.getElementById('confirmRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="confirmOverlay" style="z-index:60;">
        <div class="modal" style="max-width:400px;">
          <h3>Confirmar</h3>
          <p style="font-size:.86rem;color:var(--ink);line-height:1.5;margin:0 0 .3rem;">${message}</p>
          <div class="modal-actions">
            <button class="btn ghost" id="confirmCancelBtn">Cancelar</button>
            <button class="btn solid-danger" id="confirmOkBtn">${confirmLabel||'Excluir'}</button>
          </div>
        </div>
      </div>
    `;
    const cleanup = (result)=>{ root.innerHTML=''; resolve(result); };
    document.getElementById('confirmCancelBtn').onclick = ()=>cleanup(false);
    document.getElementById('confirmOkBtn').onclick = ()=>cleanup(true);
    document.getElementById('confirmOverlay').addEventListener('click', (e)=>{
      if(e.target.id==='confirmOverlay') cleanup(false);
    });
  });
}

async function deleteObligationFromCatalog(id){
  const o = state.obligations.find(x=>x.id===id);
  if(!o) return false;
  const ok = await showConfirm(`Excluir "${o.label}" do catálogo? Ela será removida de TODAS as empresas que a tinham marcada, e o histórico de check já feito para ela será apagado.`);
  if(!ok) return false;
  state.obligations = state.obligations.filter(x=>x.id!==id);
  if(DEFAULT_OBLIGATIONS.some(d=>d.id===id) && !state.deletedDefaultObligationIds.includes(id)){
    state.deletedDefaultObligationIds.push(id); // marca como excluída de propósito, pra não voltar sozinha
  }
  state.companies.forEach(comp=>{ if(comp.obligations) comp.obligations = comp.obligations.filter(oid=>oid!==id); });
  Object.values(state.monthly).forEach(bucket=>{
    Object.values(bucket).forEach(companyBucket=>{ delete companyBucket[id]; });
  });
  Object.values(state.annual).forEach(bucket=>{
    Object.values(bucket).forEach(companyBucket=>{ delete companyBucket[id]; });
  });
  persist();
  return true;
}

function mountManageCategoryBlock(containerEl, category, editingId){
  containerEl.innerHTML = renderManageCategoryBlock(category, editingId||null);
  function addFromInput(){
    const input = containerEl.querySelector('.oblig-new-input');
    const label = input.value.trim();
    if(!label) return;
    const id = category + '__custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    state.obligations.push({id, category, label});
    persist();
    mountManageCategoryBlock(containerEl, category);
  }
  const addBtn = containerEl.querySelector('.oblig-add-btn');
  if(addBtn) addBtn.addEventListener('click', addFromInput);
  const newInput = containerEl.querySelector('.oblig-new-input');
  if(newInput) newInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); addFromInput(); }
  });
  containerEl.querySelectorAll('[data-del-oblig]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const removed = await deleteObligationFromCatalog(btn.dataset.delOblig);
      if(removed) mountManageCategoryBlock(containerEl, category);
    });
  });
  containerEl.querySelectorAll('[data-move-oblig]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const moved = moveObligationInCategory(btn.dataset.moveOblig, parseInt(btn.dataset.moveDir,10));
      if(moved) mountManageCategoryBlock(containerEl, category);
    });
  });
  containerEl.querySelectorAll('[data-edit-oblig]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mountManageCategoryBlock(containerEl, category, btn.dataset.editOblig);
      const inputEl = containerEl.querySelector('[data-edit-input]');
      if(inputEl){ inputEl.focus(); inputEl.select(); }
    });
  });
  function saveEdit(id){
    const input = containerEl.querySelector(`[data-edit-input="${id}"]`);
    const newLabel = input.value.trim();
    if(!newLabel){ input.focus(); return; }
    const dueDayInput = containerEl.querySelector(`[data-edit-dueday="${id}"]`);
    const o = state.obligations.find(x=>x.id===id);
    if(o){
      o.label = newLabel;
      if(dueDayInput){
        const v = parseInt(dueDayInput.value, 10);
        o.dueDay = (v>=1 && v<=31) ? v : null;
      }
      persist();
    }
    mountManageCategoryBlock(containerEl, category, null);
  }
  containerEl.querySelectorAll('[data-save-oblig]').forEach(btn=>{
    btn.addEventListener('click', ()=> saveEdit(btn.dataset.saveOblig));
  });
  containerEl.querySelectorAll('[data-cancel-oblig]').forEach(btn=>{
    btn.addEventListener('click', ()=> mountManageCategoryBlock(containerEl, category, null));
  });
  containerEl.querySelectorAll('[data-edit-input]').forEach(input=>{
    input.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); saveEdit(input.dataset.editInput); }
      if(e.key==='Escape'){ e.preventDefault(); mountManageCategoryBlock(containerEl, category, null); }
    });
  });
}

function wireEnvioDropzone(){
  const dz = document.getElementById('envioDropzone');

  document.getElementById('envioBrowseBtn').addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{ handleEnvioFiles(input.files); input.value=''; });
  dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('dragover'));
  dz.addEventListener('drop', (e)=>{
    e.preventDefault(); dz.classList.remove('dragover');
    handleEnvioFiles(e.dataTransfer.files);
  });

async function handleEnvioFiles(fileList){
  const files = Array.from(fileList).filter(f=> f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  if(files.length===0) return;
  const newItems = files.map(f=>({
    id: 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    file: f, name: f.name, status:'processing', companyId:null, docTypeId:null, include:true,
  }));
  envioItems = envioItems.concat(newItems);
  renderEnvioResults();
  for(const item of newItems){
    try{
      const text = await extractPdfText(item.file);
      const company = findCompanyInText(text);
      const docType = findDocTypeInText(text);
      const { competencia, vencimento } = extractCompetenciaVencimento(text);
      item.companyId = company ? company.id : null;
      item.docTypeId = docType ? docType.id : null;
      item.competencia = competencia;
      item.vencimento = vencimento;
      item.status = 'ready';
    }catch(e){
      item.status = 'error';
      item.error = e.message || 'Erro ao ler o PDF.';
    }
    renderEnvioResults();
  }
}

        const docType = item.docTypeId ? state.docTypes.find(d=>d.id===item.docTypeId) : null;
        if(company && docType){

          preview.innerHTML = `<strong>${fillTemplate(docType.emailSubject, vars)}</strong><br>${fillTemplate(docType.emailBody, vars).replace(/\n/g,'<br>')}`;

async function sendEnvioSelected(){
  if(driveStatus!=='connected'){
    const ok = await showConfirm('Você precisa conectar o Gmail primeiro, em Configurações. Ir para lá agora?', 'Ir para Configurações');
    if(ok){ activeTab='config'; renderAll(); }
    return;
  }
  envioSending = true;
  renderEnvioResults();
  const toSend = envioItems.filter(i=> i.include && i.status==='ready');
  for(const item of toSend){
    const company = item.companyId ? state.companies.find(c=>c.id===item.companyId) : null;
    const docType = item.docTypeId ? state.docTypes.find(d=>d.id===item.docTypeId) : null;
    if(!company || !company.email || !docType){
      item.status = 'send-error';
      item.sendError = 'Falta cliente, e-mail ou tipo de documento.';
      continue;
    }
    try{
      const buffer = await item.file.arrayBuffer();
      const base64 = arrayBufferToBase64(buffer);
      const vars = {empresa: company.nome, competencia: item.competencia||'', vencimento: item.vencimento||''};
      const subject = fillTemplate(docType.emailSubject, vars);
      const body = fillTemplate(docType.emailBody, vars);
      await sendGmailWithAttachment({ to: company.email, subject, body, attachmentName: item.name, attachmentBase64: base64 });
      item.status = 'sent';
    }catch(e){
      item.status = 'send-error';
      item.sendError = e.message || 'Erro ao enviar.';
    }
    renderEnvioResults();
  }
  envioSending = false;
  renderEnvioResults();
}

        btn.textContent = '✓ Enviado';
      }catch(e){
        console.error(e);
        btn.textContent = 'Erro';
        btn.title = e.message || 'Erro ao enviar';
        setTimeout(()=>{ btn.disabled=false; btn.textContent=originalText; }, 2500);
      }
    });
  });
}

function renderDemandaResponsavelFilter(){
  const el = document.getElementById('demandaRespFilterWrap');

function renderDemandaFilters(){
  const el = document.getElementById('demandaFilters');
  if(!el) return;
  const counts = {
    todas: state.demandas.length,
    aberta: state.demandas.filter(d=>d.status==='aberta').length,
    andamento: state.demandas.filter(d=>d.status==='andamento').length,
    concluida: state.demandas.filter(d=>d.status==='concluida').length,
  };
  const labels = {todas:'Todas', aberta:'Abertas', andamento:'Em andamento', concluida:'Concluídas'};
  el.innerHTML = Object.keys(labels).map(key=>`
    <button type="button" class="demanda-filter-chip ${demandaFilter===key?'active':''}" data-demanda-filter="${key}">${labels[key]} (${counts[key]})</button>
