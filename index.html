  el.querySelectorAll('[data-demanda-filter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      demandaFilter = btn.dataset.demandaFilter;
      renderDemandaFilters();
      renderDemandaList();
    });
  });
}

function demandaCardHtml(d){
  const company = d.companyId ? state.companies.find(c=>c.id===d.companyId) : null;
  const responsavel = d.responsavelId ? state.users.find(u=>u.id===d.responsavelId) : null;
  const dt = new Date(d.criadoEm);
  const dataFmt = isNaN(dt) ? '' : dt.toLocaleDateString('pt-BR');
  return `<div class="demanda-card" data-demanda-id="${d.id}">
    <div class="demanda-card-top">
      <div>
        <div class="demanda-card-title">${escapeHtml(d.titulo) || '(sem título)'}</div>
        <div class="demanda-card-meta">${company ? escapeHtml(company.nome) : 'Cliente não vinculado'} · ${dataFmt}${responsavel ? ` · Responsável: ${escapeHtml(responsavel.nome)}` : ' · <span style="color:var(--muted);">Sem responsável</span>'}</div>
      </div>
      <select class="demanda-status-select status-${d.status}" data-demanda-status="${d.id}">
        <option value="aberta" ${d.status==='aberta'?'selected':''}>Aberta</option>
        <option value="andamento" ${d.status==='andamento'?'selected':''}>Em andamento</option>
        <option value="concluida" ${d.status==='concluida'?'selected':''}>Concluída</option>
      </select>
    </div>
    <div class="demanda-message">${escapeHtml(d.mensagem).replace(/\n/g,'<br>')}</div>
    <div class="demanda-card-actions">
      <select class="demanda-resp-select" data-demanda-responsavel="${d.id}">
        <option value="">— sem responsável —</option>
        ${state.users.filter(u=>u.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome)).map(u=>`<option value="${u.id}" ${u.id===d.responsavelId?'selected':''}>${escapeHtml(u.nome)}</option>`).join('')}
      </select>
      <div style="display:flex; gap:.2rem;">
        <button type="button" class="oblig-icon-btn" data-edit-demanda="${d.id}" title="Editar">✎</button>
        <button type="button" class="oblig-icon-btn oblig-del-btn" data-del-demanda="${d.id}" title="Excluir">×</button>
      </div>
    </div>
  </div>`;
}

function renderDemandaList(){
  const el = document.getElementById('demandaList');
  if(!el) return;
  let list = state.demandas.slice();
  if(demandaFilter!=='todas') list = list.filter(d=>d.status===demandaFilter);
  if(demandaResponsavelFilter==='none') list = list.filter(d=>!d.responsavelId);
  else if(demandaResponsavelFilter!=='todos') list = list.filter(d=>d.responsavelId===demandaResponsavelFilter);
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(d=>{
      const company = d.companyId ? state.companies.find(c=>c.id===d.companyId) : null;
      return (company && matchesSearch(company)) || (d.titulo||'').toLowerCase().includes(q) || (d.mensagem||'').toLowerCase().includes(q);
    });
  }
  list.sort((a,b)=> new Date(b.criadoEm) - new Date(a.criadoEm));
  if(list.length===0){
    el.innerHTML = `<div class="empty-note">Nenhuma demanda encontrada.</div>`;
    return;
  }
  el.innerHTML = `<div class="demanda-list-wrap">${list.map(demandaCardHtml).join('')}</div>`;
  wireDemandaCardHandlers(el);
}

function wireDemandaCardHandlers(container){
  container.querySelectorAll('[data-demanda-status]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const d = state.demandas.find(x=>x.id===sel.dataset.demandaStatus);
      if(d){ d.status = sel.value; d.atualizadoEm = new Date().toISOString(); persist(); }
      sel.className = 'demanda-status-select status-' + sel.value;
      renderDemandaFilters();
    });
  });
  container.querySelectorAll('[data-demanda-responsavel]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const d = state.demandas.find(x=>x.id===sel.dataset.demandaResponsavel);
      if(d){ d.responsavelId = sel.value || null; d.atualizadoEm = new Date().toISOString(); persist(); }
      renderDemandaList();
    });
  });
  container.querySelectorAll('[data-edit-demanda]').forEach(btn=>{
    btn.addEventListener('click', ()=> openDemandaModal(btn.dataset.editDemanda));
  });
  container.querySelectorAll('[data-del-demanda]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const d = state.demandas.find(x=>x.id===btn.dataset.delDemanda);
      if(!d) return;
      const ok = await showConfirm(`Excluir a demanda "${d.titulo||'sem título'}"? Essa ação não pode ser desfeita.`);
      if(!ok) return;
      state.demandas = state.demandas.filter(x=>x.id!==d.id);
      persist();
      renderDemandaFilters();
      renderDemandaList();
    });
  });
}

function openDemandaModal(demandaId){
  const editing = !!demandaId;
  const d = editing ? state.demandas.find(x=>x.id===demandaId) : {companyId:'', titulo:'', mensagem:'', status:'aberta', responsavelId:''};
  const root = document.getElementById('modalRoot');
  const companyOptions = state.companies.filter(c=>c.ativa!==false).sort((a,b)=>a.nome.localeCompare(b.nome))
    .map(c=>`<option value="${c.id}" ${c.id===d.companyId?'selected':''}>${c.nome}</option>`).join('');
  const userOptions = state.users.filter(u=>u.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome))
    .map(u=>`<option value="${u.id}" ${u.id===d.responsavelId?'selected':''}>${escapeHtml(u.nome)}</option>`).join('');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3>${editing? 'Editar demanda' : 'Nova demanda'}</h3>
        <div class="form-grid">
          <div class="form-row"><label>Cliente</label>
            <select id="demCompany"><option value="">— não vinculado —</option>${companyOptions}</select>
          </div>
          <div class="form-row"><label>Título curto (opcional)</label><input id="demTitulo" type="text" value="${(d.titulo||'').replace(/"/g,'&quot;')}" placeholder="Ex: Pedido de segunda via de nota"></div>
          <div class="form-row"><label>Mensagem do cliente (cole aqui)</label><textarea id="demMensagem" rows="6" style="padding:.5rem .6rem;border:1px solid var(--line-strong);border-radius:7px;font-size:.85rem;font-family:'Public Sans',sans-serif;">${(d.mensagem||'').replace(/</g,'&lt;')}</textarea><div id="demMensagemError" style="color:var(--bad);font-size:.74rem;display:none;">Cole ou digite a mensagem.</div></div>
          <div class="form-cols">
            <div class="form-row"><label>Status</label>
              <select id="demStatus">
                <option value="aberta" ${d.status==='aberta'?'selected':''}>Aberta</option>
                <option value="andamento" ${d.status==='andamento'?'selected':''}>Em andamento</option>
                <option value="concluida" ${d.status==='concluida'?'selected':''}>Concluída</option>
              </select>
            </div>
            <div class="form-row"><label>Responsável</label>
              <select id="demResponsavel">
                <option value="">— não atribuído —</option>
                ${userOptions}
              </select>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" id="btnCancel">Cancelar</button>
          <button class="btn accent" id="btnSave">Salvar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btnCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') root.innerHTML=''; });
  document.getElementById('btnSave').onclick = ()=>{
    const mensagem = document.getElementById('demMensagem').value.trim();
    if(!mensagem){
      document.getElementById('demMensagemError').style.display = 'block';
      document.getElementById('demMensagem').focus();
      return;
    }
    const companyId = document.getElementById('demCompany').value || null;
    let titulo = document.getElementById('demTitulo').value.trim();
    if(!titulo) titulo = mensagem.split('\n')[0].slice(0,60);
    const status = document.getElementById('demStatus').value;
    const responsavelId = document.getElementById('demResponsavel').value || null;
    const nowIso = new Date().toISOString();
    if(editing){
      Object.assign(d, {companyId, titulo, mensagem, status, responsavelId, atualizadoEm: nowIso});
    } else {
      state.demandas.push({
        id: 'demanda_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        companyId, titulo, mensagem, status, responsavelId,
        criadoEm: nowIso, atualizadoEm: nowIso,
      });
    }
    persist();
    root.innerHTML = '';
    renderDemandaFilters();
    renderDemandaList();
  };
}

function renderDocTypesList(){

  el.innerHTML = `<div class="doctype-list">${state.docTypes.map(dt=>`

      <div class="doctype-card-subject"><strong>Assunto:</strong> ${dt.emailSubject}</div>
    </div>
  `).join('')}</div>`;
  el.querySelectorAll('[data-edit-doctype]').forEach(btn=>{
    btn.addEventListener('click', ()=> openDocTypeModal(btn.dataset.editDoctype));
  });
  el.querySelectorAll('[data-del-doctype]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const dt = state.docTypes.find(d=>d.id===btn.dataset.delDoctype);
      if(!dt) return;
      const ok = await showConfirm(`Excluir o tipo de documento "${dt.name}"? Isso não afeta e-mails já enviados.`);

      state.docTypes = state.docTypes.filter(d=>d.id!==dt.id);

      persist();
      renderDocTypesList();
    });
  });
}

/* ---------- Importação de cadastro (planilha Domínio Sistemas) ---------- */
function onlyDigits(s){ return (s||'').toString().replace(/\D/g,''); }

function guessAtividadeFromRamo(ramo){
  const r = (ramo||'').toLowerCase();
  const isComercio = /com[eé]rcio|comercial|varejist|atacadist/.test(r);
  const isServico = /servi[cç]o|consultori|representa[cç][aã]o|apoio administrativo|advocacia|contabil/.test(r);
  const isIndustria = /ind[uú]stria|fabrica[cç][aã]o|industrial|manufatur/.test(r);
  if(isIndustria) return 'INDÚSTRIA';
  if(isComercio && isServico) return 'COMÉRCIO/SERVIÇO';
  if(isComercio) return 'COMÉRCIO';
  return 'SERVIÇO';
}

// Lê uma linha "achatada" de célula (padrão de relatório do Domínio: rótulo:,,,valor,,,rótulo2:,,,valor2)
// e devolve um mapa {rótulo: valor} para essa linha.
function scanDominioRow(row){
  const cells = (row||[]).map(c => (c===undefined||c===null) ? '' : String(c).trim());
  const out = {};
  let i = 0;
  while(i < cells.length){
    const cell = cells[i];
    if(cell.endsWith(':') && cell.length>1){
      const label = cell;
      let j = i+1;
      while(j<cells.length && cells[j]==='') j++;
      const val = (j<cells.length) ? cells[j] : '';
      if(val.endsWith(':') && val.length < 45 && !/\d/.test(val)){
        out[label] = '';
        i = j;
        continue;
      }
      out[label] = val;
      i = j+1;
    } else {
      i++;
    }
  }
  return out;
}

// A exportação "Cadastro de Empresas" do Domínio vem como uma ficha por empresa (não uma tabela linha-a-linha),
// com blocos delimitados por "DADOS CADASTRAIS". Não traz o regime tributário — isso é definido na conferência.
function parseDominioSheetRows(rows){
  const blockStarts = [];
  rows.forEach((row, idx)=>{
    if(String((row && row[0]) || '').trim() === 'DADOS CADASTRAIS') blockStarts.push(idx);
  });
  if(blockStarts.length === 0) return [];
  const parsed = [];
  blockStarts.forEach((start, bi)=>{
    const end = blockStarts[bi+1] !== undefined ? blockStarts[bi+1] : rows.length;
    const fields = {};
    rows.slice(start, end).forEach(row=> Object.assign(fields, scanDominioRow(row)));
    const nome = fields['Razão social:'] || fields['Nome:'] || '';
    if(!nome) return;
    const cnpj = fields['CNPJ/CPF/CEI/CAEPF:'] || fields['C.N.P.J.:'] || '';
    const situacao = (fields['Situação:'] || '').trim();
    const modulos = fields['Módulos:'] || '';
    const inscSuframa = fields['Insc. Suframa:'] || '';
    parsed.push({
      nome,
      cnpj: cnpj.trim(),
      ie: (fields['Insc. estadual:']||'').trim(),
      im: (fields['Insc. municipal:']||'').trim(),
      inscSuframa: inscSuframa.trim(),
      email: (fields['E-mail:']||'').trim(),
      telefone: (fields['Telefone:']||'').trim(),
      ativa: situacao.toLowerCase()==='ativa',
      folha: /folha/i.test(modulos),
      ativGuess: guessAtividadeFromRamo(fields['Ramo de atividade:']||''),
    });
  });
  return parsed;
}

async function handleImportFile(file){
  const name = file.name.toLowerCase();
  try{
    await ensureXlsx();
  }catch(e){
    await showConfirm('Não foi possível carregar a biblioteca de leitura de planilhas em nenhuma das fontes disponíveis. Verifique sua conexão com a internet e tente novamente.', 'Ok');
    return;
  }
  try{
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, {type:'array'});
    const sheetName = workbook.SheetNames[0];
    const sheet = sheetName ? workbook.Sheets[sheetName] : null;
    const rows = sheet ? XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false}) : [];
    const parsedList = rows.length ? parseDominioSheetRows(rows) : [];
    if(parsedList.length === 0){
      const isXls = name.endsWith('.xls');
      await showConfirm(
        isXls
          ? 'Não consegui ler dados nesse arquivo .xls — esse formato específico do Domínio às vezes não é reconhecido pelo navegador. Abra o arquivo no Excel ou LibreOffice, use "Salvar como" → .xlsx, e importe o arquivo convertido.'
          : 'Não encontrei nenhuma empresa nesse arquivo. Confirme se é a exportação "Cadastro de Empresas" do Domínio Sistemas (ficha por empresa, com o bloco "DADOS CADASTRAIS").',
        'Ok'
      );
      return;
    }
    importItems = parsedList.map(p=>{
      const digits = onlyDigits(p.cnpj);
      const existing = digits ? state.companies.find(c=> onlyDigits(c.cnpj)===digits) : null;
      return {
        id: 'imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        parsed: p,
        existingId: existing ? existing.id : null,
        action: existing ? 'skip' : 'create',
        include: true,
        trib: 'SIMPLES',
        ativ: p.ativGuess || 'SERVIÇO',
      };
    });
    renderImportPreviewModal();
  }catch(e){
    console.error(e);
    await showConfirm('Não foi possível ler esse arquivo. Verifique se é uma planilha .xlsx válida (ou converta o .xls no Excel/LibreOffice antes de importar).', 'Ok');
  }
}

            <option value="SERVIÇO" ${item.ativ==='SERVIÇO'?'selected':''}>Serviço</option>
            <option value="COMÉRCIO/SERVIÇO" ${item.ativ==='COMÉRCIO/SERVIÇO'?'selected':''}>Comércio/Serviço</option>
            <option value="INDÚSTRIA" ${item.ativ==='INDÚSTRIA'?'selected':''}>Indústria</option>
          </select>
        </div>
      `}
    </div>
  </div>`;
}

function wireImportPreviewHandlers(){
  const root = document.getElementById('modalRoot');
  root.querySelectorAll('[data-imp-include]').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const item = importItems.find(i=>i.id===chk.dataset.impInclude);
      if(item) item.include = chk.checked;
      updateImportFooter();
    });
  });
  root.querySelectorAll('[data-imp-action]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const item = importItems.find(i=>i.id===sel.dataset.impAction);
      if(item) item.action = sel.value;
      refreshImportRow(item); // só essa linha, sem perder a posição da rolagem
      updateImportFooter();
    });
  });
  root.querySelectorAll('[data-imp-trib]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const item = importItems.find(i=>i.id===sel.dataset.impTrib);
      if(item) item.trib = sel.value;
    });
  });
  root.querySelectorAll('[data-imp-ativ]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const item = importItems.find(i=>i.id===sel.dataset.impAtiv);
      if(item) item.ativ = sel.value;
    });
  });
  document.getElementById('btnImportCancel').onclick = ()=>{ importItems = []; root.innerHTML=''; };
  document.getElementById('importOverlay').addEventListener('click', (e)=>{ if(e.target.id==='importOverlay'){ importItems = []; root.innerHTML=''; } });
  document.getElementById('btnImportConfirm').onclick = confirmImport;
}

function refreshImportRow(item){
  const root = document.getElementById('modalRoot');
  const rowEl = root.querySelector(`[data-imp-id="${item.id}"]`);
  if(!rowEl) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = importRowHtml(item);
  const newRowEl = wrapper.firstElementChild;
  rowEl.replaceWith(newRowEl);
  // rewire só os controles dessa linha nova
  newRowEl.querySelectorAll('[data-imp-include]').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const it = importItems.find(i=>i.id===chk.dataset.impInclude);
      if(it) it.include = chk.checked;
      updateImportFooter();
    });
  });
  newRowEl.querySelectorAll('[data-imp-action]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const it = importItems.find(i=>i.id===sel.dataset.impAction);
      if(it) it.action = sel.value;
      refreshImportRow(it);
      updateImportFooter();
    });
  });
  newRowEl.querySelectorAll('[data-imp-trib]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const it = importItems.find(i=>i.id===sel.dataset.impTrib);
      if(it) it.trib = sel.value;
    });
  });
  newRowEl.querySelectorAll('[data-imp-ativ]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const it = importItems.find(i=>i.id===sel.dataset.impAtiv);
      if(it) it.ativ = sel.value;
    });
  });
}

function updateImportFooter(){
  const newCount = importItems.filter(i=> !i.existingId && i.include).length;
  const updateCount = importItems.filter(i=> i.existingId && i.action==='update').length;
  const createDupCount = importItems.filter(i=> i.existingId && i.action==='create').length;
  const infoEl = document.querySelector('#modalRoot .envio-footer-info');
  if(infoEl) infoEl.textContent = `${newCount} nova(s) · ${updateCount} atualização(ões) · ${createDupCount} duplicada(s) a criar mesmo assim`;
}

async function confirmImport(){
  let created = 0, updated = 0;
  importItems.forEach(item=>{
    const p = item.parsed;
    if(!item.existingId){
      if(!item.include) return;
      const base = {
        nome: p.nome,
        cnpj: p.cnpj || '—',
        trib: item.trib,
        ativ: item.ativ,
        ie: p.ie,
        im: p.im,
        inscSuframa: p.inscSuframa,
        email: p.email,
        telefone: p.telefone,
        folha: p.folha,
        contab: true,
        suframa: !!p.inscSuframa,
        parcelamentos: false,
        anual: true,
        ativa: p.ativa,
      };
      base.obligations = computeDefaultObligations(base);
      state.companies.push({id:'c'+Date.now()+'_'+Math.random().toString(36).slice(2,7), ...base});
      created++;
    } else if(item.action==='update'){
      const existing = state.companies.find(c=>c.id===item.existingId);
      if(existing){
        Object.assign(existing, {
          nome: p.nome,
          cnpj: p.cnpj || existing.cnpj,
          ie: p.ie || existing.ie,
          im: p.im || existing.im,
          inscSuframa: p.inscSuframa || existing.inscSuframa,
          email: p.email || existing.email,
          telefone: p.telefone || existing.telefone,
          ativa: p.ativa,
        });
        updated++;
      }
    } else if(item.action==='create'){
      const base = {
        nome: p.nome,
        cnpj: p.cnpj || '—',
        trib: item.trib,
        ativ: item.ativ,
        ie: p.ie,
        im: p.im,
        inscSuframa: p.inscSuframa,
        email: p.email,
        telefone: p.telefone,
        folha: p.folha,
        contab: true,
        suframa: !!p.inscSuframa,
        parcelamentos: false,
        anual: true,
        ativa: p.ativa,
      };
      base.obligations = computeDefaultObligations(base);
      state.companies.push({id:'c'+Date.now()+'_'+Math.random().toString(36).slice(2,7), ...base});
      created++;
    }
    // action === 'skip' -> nada a fazer
  });
  persist();
  importItems = [];
  document.getElementById('modalRoot').innerHTML = '';
  renderAll();
  await showConfirm(`Importação concluída: ${created} empresa(s) cadastrada(s) e ${updated} atualizada(s).`, 'Ok');
}

/* ---------- Master render ---------- */
function renderAll(){
  renderStats();
  renderTabs();
  renderPeriodControl();
  if(activeTab==='painel') renderPainel();
  else if(activeTab==='empresas') renderEmpresas();
  else if(activeTab==='obrigacoes') renderObrigacoes();
  else if(activeTab==='envio') renderEnvioDocumentos();
  else if(activeTab==='lembretes') renderLembretes();
  else if(activeTab==='demandas') renderDemandas();
  else if(activeTab==='config') renderConfiguracoes();
}

/* ---------- Wiring ---------- */
document.getElementById('headerDriveStatus').addEventListener('click', ()=>{
  activeTab = 'config';
  renderAll();
});
document.getElementById('monthInput').addEventListener('change', (e)=>{
  selectedMonth = e.target.value;
  renderAll();
});
document.getElementById('yearInput').addEventListener('change', (e)=>{
  selectedYear = e.target.value;
  renderAll();
});
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  renderAll();
});

// A inicialização agora acontece em auth.onAuthStateChanged() (login por pessoa via Firebase),
// que chama loadState()/renderAll()/tryAutoReconnectDrive() assim que alguém autorizado entra.

})();
